name: V4.0 CP1A RenderCore foundation QC

on:
  workflow_dispatch:
  push:
    branches: [v4.0-cp1a-rendercore-foundation]

concurrency:
  group: v4-cp1a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce neutral rendercore header boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '#include[[:space:]]*[<"](osg|osgViewer|osgUtil|vsg|vulkan|apps/openmw|components/mwworld)|\b(osg|osgViewer|osgUtil|vsg)::|\bVk[A-Z]|\bMWWorld::' components/rendercore; then
            echo 'rendercore common boundary contains a forbidden backend/game type' >&2
            exit 1
          fi

      - name: Verify CP1A foundation files
        shell: bash
        run: |
          set -euo pipefail
          test -f components/rendercore/handles.hpp
          test -f components/rendercore/resources.hpp
          test -f components/rendercore/math.hpp
          test -f components/rendercore/slottable.hpp
          test -f components/rendercore/renderworld.hpp
          test -f apps/components_tests/rendercore/foundation.cpp
          test -f apps/components_tests/rendercore/renderworld.cpp
          grep -F 'GIT_TAG 0af55ccecd98d4e5a8d1fad7de25ba429d60e863' apps/components_tests/CMakeLists.txt
          grep -F 'rendercore/renderworld.cpp' apps/components_tests/CMakeLists.txt
          git diff --check 8b5f989480903c4aeef028bd95177f44fddd00b8 HEAD

  Windows:
    needs: Preflight
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-build]') }}
    uses: ./.github/workflows/windows.yml
    with:
      image: '2022'
      tests: true
      package: false
