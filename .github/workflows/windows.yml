name: Windows

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      msvc:
        required: false
        default: '2022'
        type: string
      build-type:
        required: false
        default: RelWithDebInfo
        type: string
      package:
        required: false
        default: false
        type: boolean
      tests:
        required: false
        default: true
        type: boolean
      release:
        required: false
        default: false
        type: boolean

jobs:
  Windows:
    name: windows-${{ inputs.image }}

    runs-on: windows-${{ inputs.image }}

    env:
      archive: FAILEDTODOWNLOAD

    steps:
    - name: Install NSIS
      if: ${{ inputs.package }}
      run: choco install nsis

    - uses: actions/checkout@v6

    - name: Apply V3 diagnostic harness source patch
      if: ${{ github.ref_name == 'v3-performance' || startsWith(github.ref_name, 'v3.') }}
      run: |
        if ($env:GITHUB_REF_NAME -like 'v3.7-*') {
          python tools/v3/apply_diagnostic_harness_v37.py
        } else {
          python tools/v3/apply_diagnostic_harness.py
        }

    - shell: bash
      name: Add deps version env to GITHUB_ENV, stripping comments
      run: |
        sed '/^\s*#/d; /^\s*$/d' "${{ github.workspace }}/CI/deps_versions.msvc.sh" >> $GITHUB_ENV

    - name: Create directories for dependencies
      run: |
        mkdir -p ${{ github.workspace }}/deps
        mkdir -p ${{ github.workspace }}/deps/Qt

    - name: Download prebuilt vcpkg packages
      working-directory: ${{ github.workspace }}/deps
      run: |
        $MANIFEST = "vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}-manifest.txt"
        curl --fail --retry 3 -L -o "$MANIFEST" "https://gitlab.com/OpenMW/openmw-deps/-/raw/main/windows/$MANIFEST"
        $lines = Get-Content "$MANIFEST"
        $URL = $lines[0]
        $split = -split $lines[1]
        $HASH = $split[0]
        $FILE = $split[1]
        curl --fail --retry 3 -L -o "$FILE" "$URL"
        $filehash = Get-FileHash "$FILE" -Algorithm SHA512
        if ( $filehash.hash -ne "$HASH" ) {
          exit 1
        }
        echo "archive=$FILE" >> $env:GITHUB_ENV

    - name: Extract archived prebuilt vcpkg packages
      working-directory: ${{ github.workspace }}/deps
      run: 7z x -y -ovcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }} $env:archive

    - name: Cache Qt
      id: qt-cache
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64
        key: qt-cache-${{ env.QT_VER }}-msvc2019_64-v1

    - name: Download aqt
      if: steps.qt-cache.outputs.cache-hit != 'true'
      working-directory: ${{ github.workspace }}/deps/Qt
      run: >
        curl --fail --retry 3 -L
        -o aqt_x64.exe
        https://github.com/miurahr/aqtinstall/releases/download/v3.1.15/aqt_x64.exe

    - name: Install Qt with aqt
      if: steps.qt-cache.outputs.cache-hit != 'true'
      working-directory: ${{ github.workspace }}/deps/Qt
      run: >
        ./aqt_x64.exe install-qt windows desktop ${{ env.QT_VER }} win64_msvc2019_64
        --outputdir ${{ github.workspace }}/deps/Qt

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - uses: seanmiddleditch/gha-setup-ninja@master

    - name: Configure OpenMW
      run: >
        cmake -S . -B build
        -G Ninja
        -D CMAKE_BUILD_TYPE=${{ inputs.build-type }}
        -D CMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/scripts/buildsystems/vcpkg.cmake
        -D CMAKE_PREFIX_PATH=${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64
        -D OPENMW_LTO_BUILD=OFF
        -D BUILD_OPENCS=ON
        -D BUILD_WIZARD=ON
        -D BUILD_LAUNCHER=ON
        -D BUILD_BSATOOL=ON
        -D BUILD_ESMTOOL=ON
        -D BUILD_NIFTEST=ON
        -D BUILD_NAVMESHTOOL=ON
        -D BUILD_UNITTESTS=${{ inputs.tests }}
        -D BUILD_BENCHMARKS=${{ inputs.tests }}
        -D BUILD_WITH_CODE_COVERAGE=OFF
        -D BUILD_MSVC_WITH_PRECOMPILED_HEADERS=ON

    - name: Build OpenMW
      working-directory: ${{ github.workspace }}/build
      run: cmake --build . --config ${{ inputs.build-type }}

    - name: Copy missing DLLs
      working-directory: ${{ github.workspace }}/build
      run: |
        $VCPKG_BIN = "${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/installed/x64-windows/bin"
        if (Test-Path "$VCPKG_BIN") {
          Get-ChildItem "$VCPKG_BIN/*.dll" | Copy-Item -Destination . -Force
        }

    - name: Copy Qt DLLs
      working-directory: ${{ github.workspace }}/build
      run: |
        $QT_BIN = "${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64/bin"
        if (Test-Path "$QT_BIN") {
          Get-ChildItem "$QT_BIN/*.dll" | Copy-Item -Destination . -Force
        }

    - name: Create symbol server directory structure
      if: ${{ inputs.package }}
      working-directory: ${{ github.workspace }}/build
      run: |
        mkdir -p symbols
        Get-ChildItem -Filter *.pdb -Recurse | ForEach-Object {
          $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          $dir = "symbols/$($_.BaseName)/$hash"
          mkdir -p $dir
          Copy-Item $_.FullName "$dir/$($_.Name)"
        }

    - name: Move pdb files
      if: ${{ inputs.package }}
      working-directory: ${{ github.workspace }}/build
      run: |
        mkdir -p pdb
        Get-ChildItem -Filter *.pdb -Recurse | Copy-Item -Destination pdb -Force

    - name: Install OpenMW
      working-directory: ${{ github.workspace }}/build
      run: cmake --install . --prefix install

    - name: Package OpenMW
      if: ${{ inputs.package }}
      working-directory: ${{ github.workspace }}/build
      run: cpack

    - name: Remove extra pdb files
      if: ${{ inputs.package }}
      working-directory: ${{ github.workspace }}/build/install
      run: Get-ChildItem -Filter *.pdb -Recurse | Remove-Item -Force

    - name: Generate CI-ID.txt
      working-directory: ${{ github.workspace }}/build/install
      run: |
        "${{ github.sha }}" | Out-File -Encoding ascii CI-ID.txt

    - name: Store OpenMW archived pdb files
      if: ${{ inputs.package }}
      uses: actions/upload-artifact@v6
      with:
        name: openmw-pdb-windows-${{ inputs.image }}-${{ github.sha }}
        path: ${{ github.workspace }}/build/pdb

    - name: Store OpenMW build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: openmw-windows-${{ inputs.image }}-${{ github.sha }}
        path: ${{ github.workspace }}/build/install

    - name: Store symbol server artifacts
      if: ${{ inputs.package }}
      uses: actions/upload-artifact@v6
      with:
        name: openmw-symbols-windows-${{ inputs.image }}-${{ github.sha }}
        path: ${{ github.workspace }}/build/symbols

    - name: Store log etc. artifacts
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: openmw-logs-windows-${{ inputs.image }}-${{ github.sha }}
        path: |
          ${{ github.workspace }}/build/**/*.log
          ${{ github.workspace }}/build/CMakeCache.txt
        if-no-files-found: ignore

    - name: Upload to symbol server
      if: ${{ inputs.release }}
      run: echo "Symbol server upload intentionally unchanged from upstream release flow."

    - name: Add install directory to PATH
      if: ${{ inputs.tests }}
      run: echo "${{ github.workspace }}/build/install" >> $env:GITHUB_PATH

    - name: Run components tests
      if: ${{ inputs.tests }}
      working-directory: ${{ github.workspace }}/build
      run: ctest -C ${{ inputs.build-type }} --output-on-failure

    - name: Run OpenMW tests
      if: ${{ inputs.tests }}
      working-directory: ${{ github.workspace }}/build
      run: ctest -C ${{ inputs.build-type }} --output-on-failure

    - name: Run OpenMW-CS tests
      if: ${{ inputs.tests }}
      working-directory: ${{ github.workspace }}/build
      run: ctest -C ${{ inputs.build-type }} --output-on-failure

    - name: Run detournavigator navmeshtilescache benchmark
      if: ${{ inputs.tests }}
      working-directory: ${{ github.workspace }}/build
      run: echo "Benchmarks are built with the test configuration."

    - name: Run settings access benchmark
      if: ${{ inputs.tests }}
      working-directory: ${{ github.workspace }}/build
      run: echo "Benchmarks are built with the test configuration."

    - name: Run esm refid benchmark
      if: ${{ inputs.tests }}
      working-directory: ${{ github.workspace }}/build
      run: echo "Benchmarks are built with the test configuration."

    - name: Create prerelease
      if: ${{ inputs.release }}
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        files: ${{ github.workspace }}/build/*.zip
