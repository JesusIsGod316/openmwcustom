name: CP4F prior package error extraction
on:
  push:
    branches: [v4.0-cp4f-rendering-repair-20260922]
    paths: [.github/workflows/v4-cp4f-package-log-extract.yml]
permissions:
  actions: read
  contents: write
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Extract exception contexts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/JesusIsGod316/openmwcustom/actions/jobs/106941952125/logs > "$RUNNER_TEMP/prior-job.log"
          python3 - <<'PY'
          import os, pathlib, re
          raw=(pathlib.Path(os.environ['RUNNER_TEMP'])/'prior-job.log').read_text(encoding='utf-8-sig')
          rows=re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', raw).splitlines()
          hits=[i for i,line in enumerate(rows) if 'Traceback' in line or '##[error]' in line]
          selected=set()
          for i in hits[-8:]: selected.update(range(max(0,i-12), min(len(rows),i+25)))
          text='\n'.join(str(i+1)+': '+rows[i] for i in sorted(selected))+'\n'
          pathlib.Path('CP4F-PACKAGE-FAILURE-EXTRACT.txt').write_text(text)
          print(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CP4F-PACKAGE-FAILURE-EXTRACT.txt
          git commit -m 'CP4F: preserve exact prior exception context'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: cp4f-prior-package-log
          path: ${{ runner.temp }}/prior-job.log
          retention-days: 7
