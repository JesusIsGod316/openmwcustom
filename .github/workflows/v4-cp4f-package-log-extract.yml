name: CP4F prior package error extraction
on:
  push:
    branches: [v4.0-cp4f-rendering-repair-20260922]
    paths: [.github/workflows/v4-cp4f-package-log-extract.yml]
permissions:
  actions: read
  contents: write
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact package failure from existing job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/JesusIsGod316/openmwcustom/actions/jobs/106941952125/logs > "$RUNNER_TEMP/prior-job.log"
          python3 - <<'PY'
          import os, pathlib, re
          raw=(pathlib.Path(os.environ['RUNNER_TEMP'])/'prior-job.log').read_bytes()
          rows=raw.decode('utf-8',errors='replace').splitlines()
          hits=[i for i,line in enumerate(rows) if 'cp4f-package-config' in line]
          start=hits[-1] if hits else max(0,len(rows)-180)
          text='Log bytes: '+str(len(raw))+'\nHead: '+repr(raw[:180])+'\n'
          text+=re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', '\n'.join(rows[max(0,start-5):min(len(rows),start+90)])+'\n')
          pathlib.Path('CP4F-PACKAGE-FAILURE-EXTRACT.txt').write_text(text)
          print(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CP4F-PACKAGE-FAILURE-EXTRACT.txt
          git commit -m 'CP4F: preserve exact prior packaging error excerpt'
          git push
