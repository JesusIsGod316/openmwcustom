name: V3.11 adjacent active-grid build and QC

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run source preflight or full Windows build'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - full
  push:
    branches:
      - v3.11-adjacent-active-grid-preload

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  Preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Show exact source revision
        shell: bash
        run: |
          git rev-parse HEAD
          git status --short

      - name: Compile-check all V3 Python patch tools
        shell: bash
        run: python3 -m py_compile tools/v3/*.py

      - name: Apply complete V3.11 generated source stack
        shell: bash
        run: python3 tools/v3/apply_diagnostic_harness_v311.py

      - name: Validate generated diff and inherited foundations
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo '--- generated V3.11 diff stat ---'
          cat V3-applied-source-stat.txt

          echo '--- inherited core markers ---'
          grep -n "mV38WorldBatchingMode" components/settings/categories/cells.hpp
          grep -n "v38ForceMerge" apps/openmw/mwrender/objectpaging.cpp
          grep -n "v39OnDemandFallback" apps/openmw/mwrender/objectpaging.cpp
          grep -n "mV39FrontloadMode" components/settings/categories/cells.hpp
          grep -n "mV310FreshInitialObjectPaging" components/settings/categories/cells.hpp
          grep -n "mV310InitialFrontloadActive" apps/openmw/mwrender/objectpaging.hpp

          echo '--- V3.11 adjacent/rolling exact-active markers ---'
          grep -n "mV311ActiveGridPrepareMode" components/settings/categories/cells.hpp
          grep -n "v311ExactActiveGrid" apps/openmw/mwworld/scene.cpp
          grep -n "v311RollingExactActive" apps/openmw/mwworld/cellpreloader.cpp
          grep -n "mV311PendingTerrainPreloadPositions" apps/openmw/mwworld/cellpreloader.hpp apps/openmw/mwworld/cellpreloader.cpp
          grep -n "v311PreparedActive" apps/openmw/mwrender/objectpaging.cpp
          grep -n "V3.11 Prepared Active Built" apps/openmw/mwrender/objectpaging.cpp
          grep -n "V3.11 Demand Fallback" apps/openmw/mwrender/objectpaging.cpp
          grep -n "V3.11 Terrain Target Replaced" apps/openmw/mwworld/cellpreloader.cpp
          grep -n "v311-exact-active-shared" tools/v3/launchers/V3_Lab.ps1
          grep -n "v311-exact-active-posttransform" tools/v3/launchers/V3_Lab.ps1
          grep -n "v311-combined-shared" tools/v3/launchers/V3_Lab.ps1
          grep -n "v311-combined-posttransform" tools/v3/launchers/V3_Lab.ps1
          grep -n "benchmark_groundcover_density=1.0" tools/v3/launchers/V3_Lab.ps1

      - name: Validate V3.11 policy invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scene = Path('apps/openmw/mwworld/scene.cpp').read_text(encoding='utf-8')
          preload = Path('apps/openmw/mwworld/cellpreloader.cpp').read_text(encoding='utf-8')
          preload_h = Path('apps/openmw/mwworld/cellpreloader.hpp').read_text(encoding='utf-8')
          obj = Path('apps/openmw/mwrender/objectpaging.cpp').read_text(encoding='utf-8')
          obj_h = Path('apps/openmw/mwrender/objectpaging.hpp').read_text(encoding='utf-8')
          launcher = Path('tools/v3/launchers/V3_Lab.ps1').read_text(encoding='utf-8')
          defaults = Path('files/settings-default.cfg').read_text(encoding='utf-8')

          assert 'v3.11 active grid prepare mode = 0' in defaults
          assert 'const int stepCells = v311ExactActiveGrid ? 1 : std::max(1, mHalfGridSize + 1);' in scene
          assert 'getNewGridCenter(predictedPos, &mCurrentGridCenter)' in scene

          # New predicted grid targets are retained, not used to cancel a running
          # strong task. Same-grid jitter is explicitly ignored.
          assert 'mV311PendingTerrainPreloadPositions.assign(positions.begin(), positions.end());' in preload
          assert 'if (firstBoundsEqual(mTerrainPreloadPositions, positions))' in preload
          pending_block = preload[preload.index('if (mTerrainPreloadItem && !mTerrainPreloadItem->isDone())'):]
          pending_block = pending_block[:pending_block.index('else\n        {')]
          assert 'mTerrainPreloadItem->abort()' not in pending_block
          assert 'mV311TerrainTargetPromoted' in preload
          assert 'mV311PendingTerrainPreloadPositions' in preload_h

          # Prepared-active cleanup is compile=true AND activeGrid only.
          assert 'v311PrepareMode > 0 && compile && activeGrid && v38BatchingMode >= 2' in obj
          assert 'v311PrepareMode >= 2 && v311PreparedActive' in obj
          assert 'v39BatchOptimizerMode >= 2 || v310PreloadPostTransform || v311PreparedActive' in obj
          assert 'v39BatchOptimizerMode >= 3 || v310PreloadPostTransform || v311PreparedPostTransform' in obj

          # The inherited compile=false Mode1 fallback remains authoritative.
          assert 'v39OnDemandFallback ? std::min(v38ConfiguredBatchingMode, 1)' in obj
          assert 'v311PrepareMode > 0 && activeGrid && !compile' in obj
          assert 'mV311DemandFallbacks.fetch_add' in obj
          assert 'mV311PreparedActiveHits.fetch_add' in obj
          assert 'mV311PreparedActiveChunks' in obj_h

          lines = {n: next(line for line in launcher.splitlines() if line.lstrip().startswith(f"'{n}'"))
                   for n in (63, 64, 65, 66)}
          for n in (63, 64, 65, 66):
              line = lines[n]
              for token in ("$V38WorldBatchingMode = '2'", "$V38GpuResidencyMode = '1'",
                            "$V38CompilePacingMode = '3'", "$V39FrontloadMode = '2'",
                            "$V39BatchOptimizerMode = '1'", "$V310FreshInitialObjectPaging = 'true'"):
                  assert token in line, (n, token, line)
              assert '$V39ProactiveResidencyMode' not in line, line
              assert '$V310PreloadPostTransform' not in line, line

          assert "$V311ActiveGridPrepareMode = '1'" in lines[63]
          assert "$V311ActiveGridPrepareMode = '2'" in lines[64]
          assert "$V311ActiveGridPrepareMode = '1'" in lines[65]
          assert "$V311ActiveGridPrepareMode = '2'" in lines[66]
          assert "$V38FarShadowMode = '1'" in lines[63]
          assert "$V38FarShadowMode = '1'" in lines[64]
          assert "$V38FarShadowMode = '3'" in lines[65]
          assert "$V38FarShadowMode = '3'" in lines[66]

          print('V3.11 adjacent active-grid policy invariants passed.')
          PY

      - name: Parse-check generated PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/v3/launchers/V3_Lab.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'V3_Lab.ps1 parse check passed.'

      - name: Upload exact generated V3.11 patch
        uses: actions/upload-artifact@v4
        with:
          name: v311-preflight-applied-source-${{ github.sha }}
          path: |
            V3-applied-source.patch
            V3-applied-source-stat.txt
            V3-LAB-README.txt
          if-no-files-found: error

  Windows:
    needs: Preflight
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'full') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-build]')) }}
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      tests: false
