name: V4.0 CP0A capture frozen V3 packaging provenance

on:
  push:
    branches: [v4.0-cp0a-generated-provenance-audit]

permissions:
  contents: write

jobs:
  CapturePackagingProvenance:
    if: ${{ contains(github.event.head_commit.message, '[capture-v325-packaging]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout provenance audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reproduce frozen V3.25 generated worktree
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 1d64b33068d8322843361dd0e348b6e46b9666c0
          python3 tools/v4/V4-CP0A-Materialize-Final-V325.py

      - name: Preserve exact packaging provenance outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          root = Path.cwd()
          out = Path('/tmp/v4-cp0a-packaging-payload')
          outputs = (
              'V3-applied-source.patch',
              'V3-applied-source-stat.txt',
              'V3-BUILD-IDENTITY.txt',
              'V3-LAB-README.txt',
          )

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()

          hashes = {}
          for rel in outputs:
              src = root / rel
              if not src.is_file():
                  raise SystemExit(f'missing frozen generated packaging output: {rel}')
              hashes[rel] = sha256(src)
              dst = out / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, dst)

          manifest = out / 'tools/v4/V4-CP0A-GENERATED-PACKAGING-MANIFEST.txt'
          manifest.parent.mkdir(parents=True, exist_ok=True)
          lines = [
              'V4_CP0A_GENERATED_PACKAGING_MANIFEST/1',
              'BASE=0c47f593c9c464ef158bade8604bfda536a6d628',
              'FROZEN_V325_SOURCE=f7557829bcb14e339410cefb32b6612e5009e46d',
              'PACKAGING_OUTPUT_COUNT=4',
              '',
          ]
          for rel in outputs:
              lines.append(f'{rel}|sha256={hashes[rel]}')
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit packaging payload onto active CP1A lineage
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fdx
          git fetch origin v4.0-cp1a-rendercore-foundation
          git checkout -B v4.0-cp1a-rendercore-foundation origin/v4.0-cp1a-rendercore-foundation
          cp -a /tmp/v4-cp0a-packaging-payload/. .
          git add -- \
            V3-applied-source.patch \
            V3-applied-source-stat.txt \
            V3-BUILD-IDENTITY.txt \
            V3-LAB-README.txt \
            tools/v4/V4-CP0A-GENERATED-PACKAGING-MANIFEST.txt
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          # V3-applied-source.patch is frozen provenance. Its payload preserves
          # historical whitespace verbatim, so do not normalize or reject it.
          git diff --cached --check -- \
            V3-applied-source-stat.txt \
            V3-BUILD-IDENTITY.txt \
            V3-LAB-README.txt \
            tools/v4/V4-CP0A-GENERATED-PACKAGING-MANIFEST.txt
          git config user.name "OpenMW Custom Build CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "V4.0 CP0A: materialize frozen V3 packaging outputs [full-build]"
          git push origin HEAD:v4.0-cp1a-rendercore-foundation
