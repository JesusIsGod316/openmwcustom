name: V3.21 exterior pacing build/QC

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run source preflight or full Windows build'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - full
  push:
    branches:
      - v3.21-exterior-pacing
      - v3.21-exterior-pacing-adaptive
      - v3.21-cp2-fairness-repair
      - v3.21-cp3-fullbody-first-person
      - v3.21-cp4-shadow-compat

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  Preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Show exact source revision
        shell: bash
        run: |
          git rev-parse HEAD
          git status --short

      - name: Compile-check all V3 Python patch tools
        shell: bash
        run: python3 -m py_compile tools/v3/*.py

      - name: Apply complete V3.21 generated source stack
        shell: bash
        run: |
          set +e
          python3 tools/v3/apply_diagnostic_harness.py 2>&1 | tee v321-apply.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload V3.21 apply log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v321-apply-log-${{ github.sha }}
          path: v321-apply.log
          if-no-files-found: warn

      - name: Validate V3.21 build identity
        shell: bash
        run: |
          set -euo pipefail
          test -f V3-BUILD-IDENTITY.txt
          grep -Fx "branch=$GITHUB_REF_NAME" V3-BUILD-IDENTITY.txt
          grep -Fx 'version=V3.21' V3-BUILD-IDENTITY.txt
          grep -Fx 'harness=apply_diagnostic_harness_v321.py' V3-BUILD-IDENTITY.txt
          grep -Fx 'routing=exact-fail-closed' V3-BUILD-IDENTITY.txt
          grep -Fx 'generated_source_identity=passed' V3-BUILD-IDENTITY.txt
          if [ "$GITHUB_REF_NAME" = 'v3.21-cp2-fairness-repair' ]; then
            grep -Fx 'variant=V3.21_CP2_FAIRNESS_REPAIR' V3-BUILD-IDENTITY.txt
          elif [ "$GITHUB_REF_NAME" = 'v3.21-cp3-fullbody-first-person' ]; then
            grep -Fx 'variant=V3.21_CP3_FULL_BODY_FIRST_PERSON' V3-BUILD-IDENTITY.txt
          elif [ "$GITHUB_REF_NAME" = 'v3.21-cp4-shadow-compat' ]; then
            grep -Fx 'variant=V3.21_CP4_SHADOW_COMPAT' V3-BUILD-IDENTITY.txt
          fi

      - name: Validate generated V3.21 markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -n 'openmw-custom-v3.21-cp1-completion-governor' apps/openmw/engine.cpp
          grep -n 'V321 Completion Deferred' apps/openmw/engine.cpp
          grep -n 'V321 Completion OldestAge' apps/openmw/engine.cpp
          grep -n 'getCompiledMutex' apps/openmw/engine.cpp
          grep -n 'OPENMW_V321_COMPLETION_GOVERNOR' apps/openmw/mwrender/renderingmanager.cpp
          grep -n 'mV321CompletionGovernorMode' components/settings/categories/cells.hpp
          grep -n 'v3.21 completion governor mode = 0' files/settings-default.cfg
          grep -n '125 = V3.21 CP1 exact final V3.20 foundation control' tools/v3/launchers/V3_Lab.ps1
          grep -n '126 = V3.21 CP1 fixed completed-work admission governor' tools/v3/launchers/V3_Lab.ps1
          if grep -q '127 = V3.21 CP1 adaptive slack/debt completed-work governor' tools/v3/launchers/V3_Lab.ps1; then
            grep -n 'openmw-custom-v3.21-cp1-adaptive-governor' apps/openmw/engine.cpp
            grep -n 'V321 Adaptive MergeBudget' apps/openmw/engine.cpp
            grep -n 'mV321AdaptiveTargetMilliseconds' components/settings/categories/cells.hpp
            if [ "$GITHUB_REF_NAME" = 'v3.21-cp4-shadow-compat' ]; then
              grep -n 'Enter a listed mode (1-127 or 129-131)' tools/v3/launchers/V3_Lab.ps1
            elif [ "$GITHUB_REF_NAME" = 'v3.21-cp3-fullbody-first-person' ]; then
              grep -n 'Enter a listed mode (1-127 or 129-130)' tools/v3/launchers/V3_Lab.ps1
            elif [ "$GITHUB_REF_NAME" = 'v3.21-cp2-fairness-repair' ]; then
              grep -n 'Enter a listed mode (1-127 or 129)' tools/v3/launchers/V3_Lab.ps1
            else
              grep -n 'Enter 1 through 127' tools/v3/launchers/V3_Lab.ps1
            fi
          else
            grep -n 'Enter 1 through 126' tools/v3/launchers/V3_Lab.ps1
          fi
          if [ "$GITHUB_REF_NAME" = 'v3.21-cp2-fairness-repair' ] || [ "$GITHUB_REF_NAME" = 'v3.21-cp3-fullbody-first-person' ] || [ "$GITHUB_REF_NAME" = 'v3.21-cp4-shadow-compat' ]; then
            test -f components/resource/v321classifiedcompileset.hpp
            grep -n 'class V321ClassifiedCompileSet' components/resource/v321classifiedcompileset.hpp
            grep -n 'initializeV321CP2Fairness' apps/openmw/mwrender/renderingmanager.cpp
            grep -n 'v321CP2FairnessEnabled' apps/openmw/mwrender/objectpaging.cpp
            grep -n 'V321CompileClass::ObjectPaging' apps/openmw/mwrender/objectpaging.cpp
            grep -n 'V321CompileClass::Terrain' components/terrain/chunkmanager.cpp
            grep -n 'V321CompileClass::GenericModel' apps/openmw/mwworld/cellpreloader.cpp
            grep -n 'openmw-custom-v3.21-cp2-fairness-dephasing' apps/openmw/engine.cpp
            grep -n 'v321CP2FairnessEnabled' apps/openmw/engine.cpp
            grep -n 'V321 CP2 ObjectPaging Deferred' apps/openmw/engine.cpp
            grep -n 'V321 CP2 GenericModel Deferred' apps/openmw/engine.cpp
            grep -n 'mV321CP2FairnessMode' components/settings/categories/cells.hpp
            grep -n 'v3.21 CP2 fairness mode = 0' files/settings-default.cfg
            grep -n '129 = V3.21 CP2 class-aware completion fairness/dephasing' tools/v3/launchers/V3_Lab.ps1
            grep -n "'129'.*V321CompletionGovernor = '0'.*V321CP2Fairness = '1'" tools/v3/launchers/V3_Lab.ps1
            ! grep -q "^[[:space:]]*'128'[[:space:]]*{" tools/v3/launchers/V3_Lab.ps1
            grep -n 'Mode 128 remains unimplemented' V3-LAB-README.txt
            ! test -e components/resource/v321compileclass.hpp
            ! grep -R -n -E 'markV321CompileClass|OpenMW\.V321CompileClass\.|getOrCreateUserDataContainer\(\).*V321|osg::DummyObject' \
              components/resource/v321classifiedcompileset.hpp apps/openmw/mwrender/objectpaging.cpp \
              components/terrain/chunkmanager.cpp components/resource/scenemanager.cpp \
              apps/openmw/mwworld/cellpreloader.cpp apps/openmw/engine.cpp
          fi
          if [ "$GITHUB_REF_NAME" = 'v3.21-cp3-fullbody-first-person' ] || [ "$GITHUB_REF_NAME" = 'v3.21-cp4-shadow-compat' ]; then
            grep -n 'VM_FirstPersonFullBody' apps/openmw/mwrender/npcanimation.hpp
            grep -n 'mViewMode == VM_FirstPersonFullBody' apps/openmw/mwrender/npcanimation.cpp
            grep -n 'PRT_Neck is a' apps/openmw/mwrender/npcanimation.cpp
            grep -n 'localOffset.y() += mV321FullBodyFirstPersonForwardOffset' apps/openmw/mwrender/camera.cpp
            grep -n 'return mode == VM_FirstPerson || mode == VM_FirstPersonFullBody' apps/openmw/mwrender/npcanimation.cpp
            grep -n 'mViewMode == VM_Normal || mViewMode == VM_FirstPersonFullBody' apps/openmw/mwrender/npcanimation.cpp
            grep -n 'openmw-custom-v3.21-cp3-fullbody-first-person' apps/openmw/engine.cpp
            grep -n 'openmw-custom-v3.21-cp3-fullbody-first-person' apps/openmw/mwrender/camera.cpp
            grep -n 'isFullBodyFirstPerson' apps/openmw/mwrender/camera.hpp
            grep -n 'isFullBodyFirstPerson' apps/openmw/mwlua/camerabindings.cpp
            grep -n 'mV321FullBodyFirstPerson' components/settings/categories/camera.hpp
            grep -n 'v3.21 full body first person = false' files/settings-default.cfg
            grep -n 'v3.21 full body first person forward offset = 10.0' files/settings-default.cfg
            grep -n '130 = V3.21 CP3 true full-body first person' tools/v3/launchers/V3_Lab.ps1
            grep -n "'130'.*V321CP2Fairness = '1'.*V321CP3FullBodyFirstPerson = '1'" tools/v3/launchers/V3_Lab.ps1
            grep -n 'V3_Unified_Test.bat for normal CP3 validation' V3-LAB-README.txt
          fi
          if [ "$GITHUB_REF_NAME" = 'v3.21-cp4-shadow-compat' ]; then
            grep -n 'V321OwnerViewHiddenCullCallback' apps/openmw/mwrender/npcanimation.cpp
            grep -n 'Constants::SceneCamera' apps/openmw/mwrender/npcanimation.cpp
            grep -n 'openmw.v321.ownerViewHidden' apps/openmw/mwrender/npcanimation.cpp
            grep -n 'openmw.v321.ownerViewHidden' apps/openmw/mwrender/renderingmanager.cpp
            grep -n 'isOwnerViewHidden' apps/openmw/mwrender/renderingmanager.cpp
            ! grep -R -n 'Mask_PlayerSecondaryView' apps/openmw/mwrender
            ! grep -n 'setNodeMask(Mask_PlayerSecondaryView)' apps/openmw/mwrender/npcanimation.cpp
            grep -n 'OPENMW_V321_CP4_SHADOW_COMPAT' apps/openmw/mwrender/camera.cpp
            grep -n 'openmw_v321_animation_consumer' components/lua/luastate.cpp
            grep -n 'openmw_v321_animation_consumer' apps/openmw/mwlua/camerabindings.cpp
            grep -n 'animationConsumer && camera->isAnimationCompatibilityEnabled()' apps/openmw/mwlua/camerabindings.cpp
            grep -n 'getPhysicalMode' apps/openmw/mwlua/camerabindings.cpp
            grep -n 'getPhysicalMode' files/lua_api/openmw/camera.lua
            grep -n 'getAnimationMode' apps/openmw/mwrender/camera.hpp
            grep -n 'getAnimationMode' apps/openmw/mwlua/camerabindings.cpp
            grep -n 'getAnimationMode' files/lua_api/openmw/camera.lua
            grep -n 'v3.21 full body first person shadow compatibility = false' files/settings-default.cfg
            grep -n '131 = V3.21 CP4 full-body shadow and animation compatibility' tools/v3/launchers/V3_Lab.ps1
            grep -n "'131'.*V321CP3FullBodyFirstPerson = '1'.*V321CP4ShadowCompat = '1'" tools/v3/launchers/V3_Lab.ps1
            grep -n 'openmw-custom-v3.21-cp4-shadow-compat' apps/openmw/engine.cpp
          fi

      - name: Parse-check generated PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/v3/launchers/V3_Lab.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'V3_Lab.ps1 parse check passed.'

      - name: Upload exact generated V3.21 source
        uses: actions/upload-artifact@v4
        with:
          name: v321-preflight-applied-source-${{ github.sha }}
          path: |
            V3-applied-source.patch
            V3-applied-source-stat.txt
            V3-LAB-README.txt
            V3.18-RENDER-LAYER.txt
            V3.18-NIS-PROVENANCE.txt
            V3-BUILD-IDENTITY.txt
            tools/v3/V321-CP3-SOURCE-AUDIT.txt
            tools/v3/V321-CP4-SOURCE-AUDIT.txt
          if-no-files-found: error

  Windows:
    needs: Preflight
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'full') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-build]')) }}
    uses: ./.github/workflows/windows.yml
    with:
      image: '2022'
      tests: false
