name: V3 manual Windows build and test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run the lightweight safety preflight or the full Windows build'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - full
  push:
    branches:
      - v3.2-performance

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  Preflight:
    if: ${{ github.event_name == 'push' || inputs.mode == 'preflight' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Show exact source revision
        shell: bash
        run: |
          git rev-parse HEAD
          git status --short

      - name: Compile-check V3 Python tools
        shell: bash
        run: |
          python3 -m py_compile tools/v3/*.py

      - name: Apply complete V3 harness and safety preflights
        shell: bash
        run: |
          python3 tools/v3/apply_diagnostic_harness.py

      - name: Syntax-check standalone V3 diagnostics helpers
        shell: bash
        run: |
          cat > /tmp/v3_diagnostics_check.cpp <<'EOF'
          #include "components/debug/v3diagnostics.hpp"
          #include "components/debug/v3gpumemory.hpp"
          int main() { return 0; }
          EOF
          # Keep real warnings fatal, but do not fail this lightweight Linux
          # syntax check on libstdc++'s deprecation of std::filesystem::u8path.
          # OpenMW already uses u8path in the proven Windows code path and this
          # preflight is intended to catch V3 syntax/type mistakes, not force a
          # cross-platform filesystem API refactor.
          g++ -std=c++20 -I. -Wall -Wextra -Werror -Wno-error=deprecated-declarations \
            -fsyntax-only /tmp/v3_diagnostics_check.cpp

      - name: Validate generated source diff
        shell: bash
        run: |
          git diff --check
          echo '--- generated V3 diff stat ---'
          cat V3-applied-source-stat.txt
          echo '--- generated source safety markers ---'
          grep -n "program_link_apply" components/shader/shadermanager.cpp
          grep -n "V3InsertionAccumulatorScope insertionScope" apps/openmw/mwworld/scene.cpp
          grep -n "mV3ActiveThreads" components/sceneutil/workqueue.cpp
          grep -n "mPreparedInstanceGeneration" components/resource/scenemanager.cpp
          grep -n "v3PostFxWriter.writeLine" apps/openmw/mwrender/pingpongcanvas.cpp
          grep -n "mPhase(mEnabled ? phase" components/debug/v3diagnostics.hpp
          echo '--- V3.2 foundation markers ---'
          grep -n "mV32GpuMemoryTelemetry" components/settings/categories/cells.hpp
          grep -n "gpuMemoryWriter" components/debug/v3diagnostics.hpp
          grep -n "v3gpumemory.hpp" apps/openmw/mwrender/renderingmanager.cpp
          grep -n "adaptiveStreamingV2Enabled" components/settings/ramcache.hpp

      - name: Parse-check V3 PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/v3/launchers/V3_Lab.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'V3_Lab.ps1 parse check passed.'

      - name: Upload exact generated patch
        uses: actions/upload-artifact@v4
        with:
          name: v3-preflight-applied-source-${{ github.sha }}
          path: |
            V3-applied-source.patch
            V3-applied-source-stat.txt
            V3-LAB-README.txt
          if-no-files-found: error

  Windows:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'full') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-build]')) }}
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      tests: false
