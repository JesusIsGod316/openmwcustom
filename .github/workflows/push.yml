name: V3 manual Windows build and test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run the lightweight source preflight or the full Windows build'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - full
  push:
    branches:
      - v3.2-performance
      - v3.3-framepacing-gpu
      - v3.4-occlusion-shadows
      - v3.5-coarse-occlusion-shadow-cache
      - v3.6-multipath-optimization

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  # Fast generated-source/Python gate. Windows/MSVC remains the actual compatibility target.
  Preflight:
    if: ${{ github.event_name == 'push' || inputs.mode == 'preflight' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Show exact source revision
        shell: bash
        run: |
          git rev-parse HEAD
          git status --short

      - name: Compile-check V3 Python tools
        shell: bash
        run: |
          python3 -m py_compile tools/v3/*.py

      - name: Apply complete V3 harness and safety preflights
        shell: bash
        run: |
          python3 tools/v3/apply_diagnostic_harness.py

      - name: Validate generated source diff
        shell: bash
        run: |
          git diff --check
          echo '--- generated V3 diff stat ---'
          cat V3-applied-source-stat.txt
          echo '--- generated source safety markers ---'
          grep -n "program_link_apply" components/shader/shadermanager.cpp
          grep -n "V3InsertionAccumulatorScope insertionScope" apps/openmw/mwworld/scene.cpp
          grep -n "mV3ActiveThreads" components/sceneutil/workqueue.cpp
          grep -n "mPreparedInstanceGeneration" components/resource/scenemanager.cpp
          grep -n "v3PostFxWriter.writeLine" apps/openmw/mwrender/pingpongcanvas.cpp
          grep -n "mPhase(mEnabled ? phase" components/debug/v3diagnostics.hpp
          echo '--- V3.2 foundation markers ---'
          grep -n "mV32GpuMemoryTelemetry" components/settings/categories/cells.hpp
          grep -n "gpuMemoryWriter" components/debug/v3diagnostics.hpp
          grep -n "v3gpumemory.hpp" apps/openmw/mwrender/renderingmanager.cpp
          grep -n "adaptiveStreamingV2Enabled" components/settings/ramcache.hpp
          grep -n "v2_forced_progress" apps/openmw/mwworld/scene.cpp
          grep -n "v32RendererInsertionWriter" apps/openmw/mwworld/scene.cpp
          grep -n "beginExteriorHibernation" apps/openmw/mwrender/renderingmanager.cpp
          grep -n "consumeRestoredExteriorObject" apps/openmw/mwworld/scene.cpp
          echo '--- V3.3 frame-pacing/GPU markers ---'
          grep -n "v33_speculative_preload" apps/openmw/mwworld/scene.cpp
          grep -n "v33ReuseFarCascade" components/sceneutil/mwshadowtechnique.cpp
          grep -n "FrameTailStage::UpdateTraversal" apps/openmw/engine.cpp
          grep -n "nvmlDeviceGetMemoryInfo" components/debug/v3gpumemory.hpp
          grep -n "OPENMW_V33_FRAME_SUMMARY_FILE" components/debug/v33framestats.hpp
          echo '--- V3.4 occlusion/shadow markers ---'
          grep -n "mV34BroadenOcclusion" components/settings/categories/camera.hpp
          grep -n "v34RasterizedAsOccluder" apps/openmw/mwrender/occlusionculling.cpp
          grep -n "std::clamp(divisor, 1u, 4u)" components/sceneutil/mwshadowtechnique.cpp
          grep -n "Unified V3.4 benchmark" tools/v3/launchers/V3_Lab.ps1
          echo '--- V3.5 coarse occlusion/shadow/Lua markers ---'
          grep -n "mV35CoarseChunkOcclusion" components/settings/categories/camera.hpp
          grep -n "testVisibleCoarseAABB" components/sceneutil/occlusionculling.cpp
          grep -n "mChunkBounds" apps/openmw/mwrender/objectpaging.cpp
          grep -n "CoarseOcclusionCallback" apps/openmw/mwrender/groundcover.cpp
          grep -n "mV35AllowDynamicFarCascadeReuse" components/sceneutil/shadow.cpp
          grep -n "V35LuaLoadTrace::LoadScope" components/lua/scriptscontainer.cpp
          grep -n "benchmark_groundcover_density=1.0" tools/v3/launchers/V3_Lab.ps1
          echo '--- V3.6 profile/profiler/attribution markers ---'
          grep -n "mV36PerformanceProfile" components/settings/categories/cells.hpp
          grep -n "ramOverdriveEnabled" components/settings/v36profile.hpp
          grep -n "GL_QUERY_RESULT_AVAILABLE" components/debug/v36gpuprofiler.hpp
          grep -n "mV36FarCasterMinimumPixels" components/sceneutil/mwshadowtechnique.cpp
          grep -n "mPagedEstimatedChildrenSkipped" components/sceneutil/occlusionculling.hpp
          grep -n "OPENMW_V36_LUA_ADDSCRIPT_FILE" components/debug/v36luaaddscripttrace.hpp
          grep -n "OPENMW_V36_CONTROLLER_FILE" components/debug/v36controllertrace.hpp
          grep -n "OPENMW_V36_RESIDENCY_FILE" components/resource/imagemanager.cpp
          grep -n "OPENMW_V36_BATCHING_FILE" components/debug/v36structuretrace.hpp
          grep -n "v36-true-custom-baseline" tools/v3/launchers/V3_Lab.ps1

      - name: Parse-check V3 PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/v3/launchers/V3_Lab.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'V3_Lab.ps1 parse check passed.'

      - name: Upload exact generated patch
        uses: actions/upload-artifact@v4
        with:
          name: v3-preflight-applied-source-${{ github.sha }}
          path: |
            V3-applied-source.patch
            V3-applied-source-stat.txt
            V3-LAB-README.txt
          if-no-files-found: error

  Windows:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'full') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-build]')) }}
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      tests: false
