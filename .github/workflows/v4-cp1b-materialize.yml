name: V4.0 CP1B SDL3 source materializer

on:
  push:
    branches: [v4.0-cp1b-sdl3-opengl-parity]
    paths:
      - tools/v4/V4-CP1B-*.py
      - .github/workflows/v4-cp1b-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4-cp1b-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CP1B head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify corrected CP1A ancestry
        shell: bash
        run: |
          set -euo pipefail
          CP1A_BASE=0bd575fb8dc5665034cdd57da62a6813db0a1bb3
          git merge-base --is-ancestor "${CP1A_BASE}" HEAD

      - name: Materialize native SDL3 migration and repairs
        shell: bash
        run: |
          set -euo pipefail
          for script in tools/v4/V4-CP1B-*.py; do
            echo "Running ${script}"
            python3 "${script}"
          done
          git diff > "$RUNNER_TEMP/cp1b-first.diff"

      - name: Verify materializer idempotency and frozen provenance
        shell: bash
        run: |
          set -euo pipefail
          for script in tools/v4/V4-CP1B-*.py; do
            echo "Rechecking ${script}"
            python3 "${script}"
          done
          git diff > "$RUNNER_TEMP/cp1b-second.diff"
          cmp "$RUNNER_TEMP/cp1b-first.diff" "$RUNNER_TEMP/cp1b-second.diff"
          git diff --check -- . \
            ':(exclude)V3-applied-source.patch' \
            ':(exclude)V3-applied-source-stat.txt' \
            ':(exclude)V3-BUILD-IDENTITY.txt' \
            ':(exclude)V3-LAB-README.txt'
          git diff --exit-code -- V3-applied-source.patch V3-applied-source-stat.txt V3-BUILD-IDENTITY.txt V3-LAB-README.txt
          git status --short

      - name: Commit materialized CP1B source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'CP1B SDL3 migration is already materialized.'
            exit 0
          fi
          git config user.name 'OpenMW Custom Build CI'
          git config user.email 'actions@users.noreply.github.com'
          git add CMakeLists.txt apps components extern/oics extern/osg-ffmpeg-videoplayer
          git diff --cached --check
          git commit -m 'V4.0 CP1B: materialize broad native SDL3 semantic migration [full-build]'
          git push origin HEAD:v4.0-cp1b-sdl3-opengl-parity
