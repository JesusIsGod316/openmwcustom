name: OptimizedMW P8G3 shader deployment repair hold
on:
  push:
    branches: [optimizedmw/gl-p8g3-visibility-lod]
    paths: [.github/workflows/optimizedmw-gl-p4.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  StopObsoleteGate:
    runs-on: ubuntu-24.04
    steps:
      - name: Stop only superseded P8G3 gate with unpatched PBR overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/JesusIsGod316/openmwcustom/actions/runs/36375563293 > /tmp/run.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/run.json'))
          assert r['head_sha']=='85933fed0d00b0e6fa8b39964650cb9456cf9055'
          assert r['head_branch']=='optimizedmw/gl-p8g3-visibility-lod'
          assert r['path']=='.github/workflows/optimizedmw-gl-p4.yml'
          PY
          if [ "$(python -c 'import json; print(json.load(open("/tmp/run.json"))["status"])')" != completed ]; then
            gh api --method POST repos/JesusIsGod316/openmwcustom/actions/runs/36375563293/cancel
          fi
