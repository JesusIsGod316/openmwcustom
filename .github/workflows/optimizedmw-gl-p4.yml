name: OptimizedMW GL-P4R heavy GL gate

on:
  push:
    branches: [optimizedmw/gl-p4r-heavy-gl]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  Source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install native OSG
        run: sudo apt-get update -qq && sudo apt-get install -y libopenscenegraph-dev
      - name: Verify retained P3 and P4 contracts
        run: |
          set -euo pipefail
          python tools/optimizedmw/gl-p3/source-contract.py
          python tools/optimizedmw/gl-p4/source-contract.py
      - name: Configure P3
        run: cmake -S tools/optimizedmw/gl-p3 -B build-p3 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DOPTIMIZEDMW_P3_SANITIZERS=ON
      - name: Test retained P3
        run: |
          cmake --build build-p3 --parallel 2
          ctest --test-dir build-p3 -V --output-on-failure
      - name: Configure P4
        run: cmake -S tools/optimizedmw/gl-p4 -B build-p4 -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build and test P4
        run: |
          cmake --build build-p4 --parallel 2
          ctest --test-dir build-p4 -V --output-on-failure

  Windows:
    needs: Source
    uses: ./.github/workflows/windows.yml
    with:
      image: '2022'
      tests: true
      package: false
