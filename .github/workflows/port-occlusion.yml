name: Port occlusion commit

on:
  push:
    branches:
      - occlusion-0.52-custom
    paths:
      - .github/workflows/port-occlusion.yml
  pull_request:
    branches:
      - occlusion-0.52-custom
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message || '', '[occlusion-port-result]') }}
    runs-on: windows-2022
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: occlusion-0.52-custom
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "OpenMW Occlusion Port Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Fetch occlusion source commit
        shell: bash
        run: |
          git remote add occlusion https://github.com/RebelSiren/openmwocclusion.git || true
          git fetch --no-tags occlusion eb153471a4149967f13aebdf496ef4e184d00fba

      - name: Cherry-pick occlusion changes without committing
        id: cherry
        continue-on-error: true
        shell: bash
        run: |
          git cherry-pick --no-commit eb153471a4149967f13aebdf496ef4e184d00fba

      - name: Save conflict diagnostics
        if: steps.cherry.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p port-diagnostics
          git status --short > port-diagnostics/status.txt
          git diff --name-only --diff-filter=U > port-diagnostics/unmerged-files.txt
          git diff --cc > port-diagnostics/conflicts.diff || true
          while IFS= read -r f; do
            if [ -f "$f" ]; then
              mkdir -p "port-diagnostics/files/$(dirname "$f")"
              cp "$f" "port-diagnostics/files/$f"
            fi
          done < port-diagnostics/unmerged-files.txt

      - name: Upload conflict diagnostics
        if: steps.cherry.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: occlusion-port-conflicts
          path: port-diagnostics

      - name: Fail when merge needs manual adaptation
        if: steps.cherry.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Commit successful port
        if: steps.cherry.outcome == 'success'
        shell: bash
        run: |
          git add -A
          git commit -m "Port occlusion culling to current 0.52 master [occlusion-port-result]"
          git push origin HEAD:occlusion-0.52-custom
