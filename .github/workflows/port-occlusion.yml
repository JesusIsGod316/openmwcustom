name: Port occlusion commit

on:
  push:
    branches:
      - occlusion-0.52-custom
    paths:
      - .github/workflows/port-occlusion.yml
  pull_request:
    branches:
      - occlusion-0.52-custom
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message || '', '[occlusion-port-result]') }}
    runs-on: windows-2022
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: occlusion-0.52-custom
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "OpenMW Occlusion Port Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Fetch occlusion source commit
        shell: bash
        run: |
          git remote add occlusion https://github.com/RebelSiren/openmwocclusion.git || true
          git fetch --no-tags occlusion eb153471a4149967f13aebdf496ef4e184d00fba

      - name: Apply occlusion changes
        id: cherry
        continue-on-error: true
        shell: bash
        run: |
          git cherry-pick --no-commit eb153471a4149967f13aebdf496ef4e184d00fba

      - name: Adapt known current-master conflicts
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_conflict(path, replacement, expected=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              pattern = re.compile(
                  r"<<<<<<< HEAD\r?\n.*?=======\r?\n.*?>>>>>>> eb153471a4 \(Add MSOC occlusion culling, shadow improvements, and occluder mesh disk cache\)\r?\n",
                  re.S,
              )
              new_text, count = pattern.subn(replacement, text, count=expected)
              if count != expected:
                  raise RuntimeError(f"{path}: expected {expected} known conflict block, found {count}")
              p.write_text(new_text, encoding="utf-8", newline="\n")

          replace_conflict(
              "apps/openmw/mwrender/objectpaging.cpp",
              '#include <limits>\n\n#include "occlusionculling.hpp"\n\n#include <components/sceneutil/occlusionculling.hpp>\n\n',
          )

          replace_conflict(
              "apps/openmw/mwrender/renderingmanager.cpp",
              '#include <components/sceneutil/material.hpp>\n#include <components/sceneutil/occlusionculling.hpp>\n#include <components/occlusionculling/occlusionstorage.hpp>\n',
          )

          replace_conflict(
              "components/CMakeLists.txt",
              '    screencapture depth color riggeometryosgaextension extradata unrefqueue lightcommon clearcolor\n'
              '    cullsafeboundsvisitor keyframe nodecallback textkeymap glextensions fog texmat material occlusionculling\n',
          )

      - name: Verify merge is fully resolved
        shell: bash
        run: |
          git add apps/openmw/mwrender/objectpaging.cpp \
                  apps/openmw/mwrender/renderingmanager.cpp \
                  components/CMakeLists.txt
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved files remain:"
            echo "$unresolved"
            exit 1
          fi

      - name: Commit adapted port
        shell: bash
        run: |
          git add -A
          git commit -m "Port MSOC occlusion culling to current master [occlusion-port-result]"
          git push origin HEAD:occlusion-0.52-custom
