name: V4.0 CP3B semantic QC

on:
  workflow_dispatch:
  push:
    branches: [v4.0-cp3b-nif-static-vulkan, v4.0-cp3b4-corpus-staging]

concurrency:
  group: v4-cp3b-semantic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  SemanticCore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CP3B head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact CP3A ancestry
        shell: bash
        run: |
          set -euo pipefail
          CP3A_BASE=9e973f5648a6bd7ff90986f79936cb49946cc875
          git cat-file -e "${CP3A_BASE}^{commit}"
          merge_base=$(git merge-base "${CP3A_BASE}" HEAD)
          test "${merge_base}" = "${CP3A_BASE}"

      - name: Verify complete CP0A materialization
        run: python3 tools/v4/V4-CP0A-Verify-Materialized-Generated-Outputs.py

      - name: Enforce neutral RenderCore purity
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '#include[[:space:]]*[<"](osg|osgViewer|osgUtil|vsg|vulkan|apps/openmw|components/mwworld|components/nif)|\b(osg|osgViewer|osgUtil|vsg)::|\bVk[A-Z]|\bMWWorld::|\bNif::' components/rendercore; then
            echo 'RenderCore common boundary contains a forbidden backend/game/source-format dependency' >&2
            exit 1
          fi
          grep -F 'using ModelHandle' components/rendercore/handles.hpp
          grep -F 'struct ModelPayload' components/rendercore/records.hpp
          grep -F 'std::shared_ptr<const ModelPayload>' components/rendercore/records.hpp
          grep -F 'struct CreateModel' components/rendercore/updatebatch.hpp

      - name: Validate CP3B4 corpus tooling contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/v4/cp3b4/corpus-runner.py tools/v4/cp3b4/test-corpus-runner.py
          python3 -m json.tool tools/v4/cp3b4/corpus.schema.json >/dev/null
          python3 -m json.tool tools/v4/cp3b4/corpus.local.example.json >/dev/null
          python3 tools/v4/cp3b4/test-corpus-runner.py
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -I. \
            tools/v4/cp3b4/asset-report-smoke.cpp \
            -o /tmp/v4-cp3b4-asset-report-smoke
          /tmp/v4-cp3b4-asset-report-smoke > /tmp/v4-cp3b4-asset-report.json
          python3 -m json.tool /tmp/v4-cp3b4-asset-report.json >/dev/null
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("tools/v4/cp3b4/Stage-Conformance-Package.ps1", [ref]$tokens, [ref]$errors); if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          grep -F 'openmw-v4-cp3b4-asset-report-v1' tools/v4/cp3b4/asset-report.hpp
          grep -F -- '--report-json' tools/v4/cp3b3/nif-conformance.cpp
          grep -F 'openmw-v4-cp3b4-corpus-report-v1' tools/v4/cp3b4/corpus-runner.py

      - name: Install lightweight compile dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglm-dev libopenscenegraph-dev

      - name: Compile neutral semantic smoke target
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -I. \
            tools/v4/cp3b/rendercore-semantic-smoke.cpp \
            -o /tmp/v4-cp3b-rendercore-smoke

      - name: Compile content identity smoke target
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -I. \
            tools/v4/cp3b/content-identity-smoke.cpp \
            -o /tmp/v4-cp3b-content-identity-smoke

      - name: Compile static realization plan smoke target
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -I. \
            tools/v4/cp3b/static-asset-plan-smoke.cpp \
            -o /tmp/v4-cp3b-static-asset-plan-smoke

      - name: Compile loader-global sort policy smoke target
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -I. \
            tools/v4/cp3b/static-sort-policy-smoke.cpp \
            -o /tmp/v4-cp3b-static-sort-policy-smoke

      - name: Compile texture identity smoke target
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -I. \
            tools/v4/cp3b/texture-identity-smoke.cpp \
            -o /tmp/v4-cp3b-texture-identity-smoke

      - name: Compile texture binding smoke target
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -I. \
            tools/v4/cp3b/texture-binding-smoke.cpp \
            -o /tmp/v4-cp3b-texture-binding-smoke

      - name: Compile BS shader material smoke target
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -I. \
            tools/v4/cp3b/bs-shader-material-smoke.cpp \
            -o /tmp/v4-cp3b-bs-shader-material-smoke

      - name: Compile LOD selection smoke target
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -I. \
            tools/v4/cp3b/lod-selection-smoke.cpp \
            -o /tmp/v4-cp3b-lod-selection-smoke

      - name: Compile material semantics smoke target
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -I. \
            tools/v4/cp3b/material-semantics-smoke.cpp \
            -o /tmp/v4-cp3b-material-semantics-smoke

      - name: Compile drawable material smoke target
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -I. \
            tools/v4/cp3b/drawable-material-smoke.cpp \
            -o /tmp/v4-cp3b-drawable-material-smoke

      - name: Compile inherited material join pass
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -I. \
            tools/v4/cp3b/material-pass-compile.cpp \
            -o /tmp/v4-cp3b-material-pass-compile

      - name: Compile VFS identity resolver
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -I. \
            tools/v4/cp3b/vfs-identity-compile.cpp \
            -o /tmp/v4-cp3b-vfs-identity-compile

      - name: Compile NIF translator adapter
        shell: bash
        run: |
          set -euo pipefail
          # Current parser headers contain a few intentional empty virtual stubs
          # with named parameters. Exempt that inherited warning only; all other
          # translator warnings remain fatal.
          g++ -std=c++20 -O1 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -I. \
            -c components/nifrender/niftranslator.cpp \
            -o /tmp/v4-cp3b-niftranslator.o

      - name: Compile integrated static NIF translator
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -I. \
            -c components/nifrender/staticniftranslator.cpp \
            -o /tmp/v4-cp3b-staticniftranslator.o

      - name: Run neutral semantic smoke target
        run: /tmp/v4-cp3b-rendercore-smoke

      - name: Run content identity smoke target
        run: /tmp/v4-cp3b-content-identity-smoke

      - name: Run static realization plan smoke target
        run: /tmp/v4-cp3b-static-asset-plan-smoke

      - name: Run loader-global sort policy smoke target
        run: /tmp/v4-cp3b-static-sort-policy-smoke

      - name: Run texture identity smoke target
        run: /tmp/v4-cp3b-texture-identity-smoke

      - name: Run texture binding smoke target
        run: /tmp/v4-cp3b-texture-binding-smoke

      - name: Run BS shader material smoke target
        run: /tmp/v4-cp3b-bs-shader-material-smoke

      - name: Run LOD selection smoke target
        run: /tmp/v4-cp3b-lod-selection-smoke

      - name: Run material semantics smoke target
        run: /tmp/v4-cp3b-material-semantics-smoke

      - name: Run drawable material smoke target
        run: /tmp/v4-cp3b-drawable-material-smoke

      - name: Run VFS identity smoke target
        run: /tmp/v4-cp3b-vfs-identity-compile

      - name: Check CP3B whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 9e973f5648a6bd7ff90986f79936cb49946cc875 HEAD -- . \
            ':(exclude)V3-applied-source.patch' \
            ':(exclude)V3-applied-source-stat.txt' \
            ':(exclude)V3-BUILD-IDENTITY.txt' \
            ':(exclude)V3-LAB-README.txt'
