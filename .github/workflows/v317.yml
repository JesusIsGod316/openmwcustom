name: V3.17 Lua/runtime hitch consolidation build and QC

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run source preflight or full Windows build'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - full
  push:
    branches:
      - v3.17-lua-runtime-hitch-consolidation

env:
  BUILD_TYPE: RelWithDebInfo
  V317_RUBICON_SOURCE: f3ee18afcc8c029dc7e13c8c69fe119dbcbc4c50

jobs:
  Preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Show exact source revision
        shell: bash
        run: |
          git rev-parse HEAD
          git status --short

      - name: Compile-check all V3 Python patch tools
        shell: bash
        run: python3 -m py_compile tools/v3/*.py

      - name: Apply complete V3.17 generated source stack
        shell: bash
        run: |
          set +e
          python3 tools/v3/apply_diagnostic_harness_v317.py 2>&1 | tee v317-apply.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload V3.17 apply log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v317-apply-log-${{ github.sha }}
          path: v317-apply.log
          if-no-files-found: error

      - name: Validate generated diff and V3.17 markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cat V3-applied-source-stat.txt
          grep -n "class DiagnosticWriterHub" components/debug/v3diagnostics.hpp
          grep -n "sMaxQueuedItems = 16384" components/debug/v3diagnostics.hpp
          grep -n "mQueue.push_back({ channel, {}, true })" components/debug/v3diagnostics.hpp
          grep -n "std::try_to_lock" components/debug/v3diagnostics.hpp
          grep -n "No gameplay-cadence flushes" components/debug/v3diagnostics.hpp
          grep -n "V3.17 Lua/runtime hitch consolidation" V3-LAB-README.txt
          grep -n "90 = V3.17 control" tools/v3/launchers/V3_Lab.ps1
          grep -n "v317-rubicon-only" tools/v3/launchers/V3_Lab.ps1
          grep -n "v317-combined-balanced" tools/v3/launchers/V3_Lab.ps1
          grep -n "Enter 1 through 94" tools/v3/launchers/V3_Lab.ps1
          grep -n "OPENMW_V317_LUA_OPT" tools/v3/launchers/V3_Lab.ps1
          grep -n "v317-runtime" tools/v3/launchers/V3_Lab.ps1
          grep -n "class HeadCache" apps/openmw/mwsound/headcache.hpp
          grep -n "class SfxPredecodeCache" apps/openmw/mwsound/sfxpredecodecache.hpp
          grep -n "mV316IdleResourceSweep" components/settings/categories/cells.hpp

      - name: Validate V3.17 policy invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          diag = Path('components/debug/v3diagnostics.hpp').read_text(encoding='utf-8')
          readme = Path('V3-LAB-README.txt').read_text(encoding='utf-8')
          launcher = Path('tools/v3/launchers/V3_Lab.ps1').read_text(encoding='utf-8')
          cells = Path('components/settings/categories/cells.hpp').read_text(encoding='utf-8')
          changed = set(__import__('subprocess').check_output(['git','diff','--name-only'], text=True).splitlines())

          # One shared writer hub for every V3 CsvWriter. Producer enqueue remains
          # nonblocking and bounded; file open/header work belongs to the writer.
          assert diag.count('class DiagnosticWriterHub') == 1
          assert 'sMaxQueuedItems = 16384' in diag
          assert 'std::try_to_lock' in diag
          assert 'mQueue.push_back({ channel, {}, true })' in diag
          assert 'DiagnosticWriterHub::instance().enqueue(mChannel, line)' in diag
          assert 'DiagnosticWriterHub::instance().registerChannel(mPath, mHeader)' in diag

          # V3.16 per-stream writer threads and periodic 240-row flushes must not
          # survive the V3.17 layer. Only the hub owns a writer thread.
          assert diag.count('std::thread mWriterThread;') == 1
          assert 'linesSinceFlush >= 240' not in diag
          assert 'sMaxQueuedLines = 4096' not in diag
          assert diag.count('mStream.flush();') == 1
          assert '# v3_async_diagnostics_dropped_lines=' in diag

          # Runtime selection is deterministic and restores stock after each lab
          # run. Current OpenMW content.lua stays untouched by V3.17.
          for token in ('90 = V3.17 control', 'v317-stock-control', 'v317-rubicon-only',
                        'v317-engine-lua-only', 'v317-combined-balanced',
                        'v317-combined-aggressive-sfx', 'Enter 1 through 94',
                        'V317-LUAJIT-RUNTIME.txt', 'OPENMW_V317_LUA_OPT'):
              assert token in launcher, token
          assert "$V317LuaRuntime = 'stock'" in launcher
          assert "$V317LuaRuntime = 'rubicon'" in launcher
          assert 'Copy-Item -LiteralPath $stockLua -Destination $rootLua -Force' in launcher
          assert not any(name.endswith('content.lua') for name in changed), sorted(changed)

          # Preserve V3.16/V3.15 gameplay foundation while V3.17 changes the
          # runtime/hitch lane only.
          for token in ('mV313ChunkQualityMode', 'mV315PremergeStateCanonicalization',
                        'mV315PacketizedPremergeMode', 'mV315AdaptiveCompileGovernor',
                        'mV316IdleResourceSweep'):
              assert token in cells, token
          assert 'v316-balanced-hitch' in launcher
          assert 'V3.17 Lua/runtime hitch consolidation' in readme
          assert 'Consolidated diagnostic writer' in readme
          assert 'Runtime attribution matrix' in readme

          print('V3.17 generated-source policy invariants passed.')
          PY

      - name: Parse-check generated PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/v3/launchers/V3_Lab.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'V3_Lab.ps1 parse check passed.'

      - name: Upload exact generated V3.17 patch
        uses: actions/upload-artifact@v4
        with:
          name: v317-preflight-applied-source-${{ github.sha }}
          path: |
            V3-applied-source.patch
            V3-applied-source-stat.txt
            V3-LAB-README.txt
            V3.16-HITCH-LAYER.txt
            V3.17-RUNTIME-LAYER.txt
          if-no-files-found: error

  Windows:
    needs: Preflight
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'full') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-build]')) }}
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      tests: false

  V317RuntimePackage:
    name: stage-pinned-rubicon-runtime
    needs: Windows
    runs-on: windows-latest
    steps:
      - name: Download exact OpenMW Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: openmw-windows-2022-${{ github.sha }}
          path: v317-package

      - uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c
        with:
          arch: x64

      - name: Build exact sandboxed Rubic0n source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone https://github.com/DreamWeave-MP/rubic0n.git v317-rubicon
          git -C v317-rubicon checkout --detach $env:V317_RUBICON_SOURCE
          $actual = (git -C v317-rubicon rev-parse HEAD).Trim()
          if ($actual -ne $env:V317_RUBICON_SOURCE) { throw "Rubic0n source identity mismatch: $actual" }
          Push-Location v317-rubicon\src
          try {
            cmd /c msvcbuild.bat lua52compat
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          .\v317-rubicon\src\luajit.exe -e "assert(jit.version_num >= 20100); assert(jit.os == 'Windows'); assert(jit.arch == 'x64'); local ok=pcall(select,'sandbox.bypass'); assert(not ok); assert(jit.gcstats == nil); print(jit.version,jit.os,jit.arch)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage stock and Rubic0n runtimes beside OpenMW
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stockCandidate = Get-ChildItem -LiteralPath v317-package -Recurse -File -Filter lua51.dll | Select-Object -First 1
          if ($null -eq $stockCandidate) { throw 'Stock lua51.dll not found in OpenMW artifact' }
          $packageRoot = $stockCandidate.Directory.FullName
          if (-not (Test-Path -LiteralPath (Join-Path $packageRoot 'openmw.exe'))) {
            throw "lua51.dll was not beside openmw.exe: $packageRoot"
          }
          $runtimeRoot = Join-Path $packageRoot 'v317-runtime'
          $stockDir = Join-Path $runtimeRoot 'stock'
          $rubiconDir = Join-Path $runtimeRoot 'rubicon'
          New-Item -ItemType Directory -Force -Path $stockDir,$rubiconDir | Out-Null
          Copy-Item -LiteralPath $stockCandidate.FullName -Destination (Join-Path $stockDir 'lua51.dll') -Force
          Copy-Item -LiteralPath 'v317-rubicon\src\lua51.dll' -Destination (Join-Path $rubiconDir 'lua51.dll') -Force
          $stockHash = (Get-FileHash -LiteralPath (Join-Path $stockDir 'lua51.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          $rubiconHash = (Get-FileHash -LiteralPath (Join-Path $rubiconDir 'lua51.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @(
            'V3.17 LuaJIT runtime manifest',
            "openmw_commit=${{ github.sha }}",
            "rubicon_source=$env:V317_RUBICON_SOURCE",
            'rubicon_variant=sandboxed',
            'rubicon_sandbox_bypass=disabled',
            'rubicon_gcstats=disabled',
            'rubicon_profile=upstream-development-source-exact',
            'rubicon_pagealloc=upstream-default-enabled',
            'rubicon_finalizer_contract=upstream-development-contract-experimental',
            'content_lua=current-openmw-retained',
            "stock_lua51_sha256=$stockHash",
            "rubicon_lua51_sha256=$rubiconHash",
            'normal_direct_launch_runtime=stock',
            'promotion_status=experimental-attribution-until-benchmark-and-compatibility-QA',
            ''
          )
          [System.IO.File]::WriteAllLines((Join-Path $runtimeRoot 'V317-LUAJIT-RUNTIME.txt'), $manifest, [System.Text.UTF8Encoding]::new($false))
          # Root remains stock. The lab launcher swaps only before process start
          # and restores stock after exit.
          $rootHash = (Get-FileHash -LiteralPath $stockCandidate.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($rootHash -ne $stockHash) { throw 'Root lua51.dll no longer matches staged stock runtime' }
          Get-Content -LiteralPath (Join-Path $runtimeRoot 'V317-LUAJIT-RUNTIME.txt')

      - name: Upload V3.17 runtime-complete Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmw-v317-windows-2022-${{ github.sha }}
          path: v317-package/**
          if-no-files-found: error
