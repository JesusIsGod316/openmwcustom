name: V3.22 CP1 MSOC hot-path build/QC

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run source preflight or full Windows build'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - full
  push:
    branches:
      - v3.22-cp1-msoc-hotpath

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  Preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Show exact source revision
        shell: bash
        run: |
          git rev-parse HEAD
          git status --short

      - name: Compile-check all V3 Python patch tools
        shell: bash
        run: python3 -m py_compile tools/v3/*.py

      - name: Apply complete V3.22 generated source stack
        shell: bash
        run: |
          set +e
          python3 tools/v3/apply_diagnostic_harness.py 2>&1 | tee v322-apply.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload V3.22 apply log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v322-apply-log-${{ github.sha }}
          path: v322-apply.log
          if-no-files-found: warn

      - name: Validate V3.22 build identity
        shell: bash
        run: |
          set -euo pipefail
          test -f V3-BUILD-IDENTITY.txt
          grep -Fx "branch=$GITHUB_REF_NAME" V3-BUILD-IDENTITY.txt
          grep -Fx 'version=V3.22' V3-BUILD-IDENTITY.txt
          grep -Fx 'harness=apply_diagnostic_harness_v322.py' V3-BUILD-IDENTITY.txt
          grep -Fx 'routing=exact-fail-closed' V3-BUILD-IDENTITY.txt
          grep -Fx 'generated_source_identity=passed' V3-BUILD-IDENTITY.txt

      - name: Validate inherited V3.21 foundation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          # Accepted CP2 transient-job classification; never restore scenegraph metadata.
          test -f components/resource/v321classifiedcompileset.hpp
          grep -n 'class V321ClassifiedCompileSet' components/resource/v321classifiedcompileset.hpp
          grep -n 'V321CompileClass::ObjectPaging' apps/openmw/mwrender/objectpaging.cpp
          grep -n 'V321CompileClass::Terrain' components/terrain/chunkmanager.cpp
          grep -n 'V321CompileClass::GenericModel' apps/openmw/mwworld/cellpreloader.cpp
          ! grep -R -n -E 'markV321CompileClass|OpenMW\.V321CompileClass\.|osg::DummyObject' \
            components/resource/v321classifiedcompileset.hpp apps/openmw/mwrender/objectpaging.cpp \
            components/terrain/chunkmanager.cpp components/resource/scenemanager.cpp \
            apps/openmw/mwworld/cellpreloader.cpp apps/openmw/engine.cpp

          # Accepted CP3/CP4 FBFP and compatibility behavior must survive unchanged.
          grep -n 'VM_FirstPersonFullBody' apps/openmw/mwrender/npcanimation.hpp
          grep -n 'localOffset.y() += mV321FullBodyFirstPersonForwardOffset' apps/openmw/mwrender/camera.cpp
          grep -n 'V321OwnerViewHiddenCullCallback' apps/openmw/mwrender/npcanimation.cpp
          grep -n 'Constants::SceneCamera' apps/openmw/mwrender/npcanimation.cpp
          grep -n 'openmw_v321_animation_consumer' components/lua/luastate.cpp
          grep -n 'animationConsumer && camera->isAnimationCompatibilityEnabled()' apps/openmw/mwlua/camerabindings.cpp
          grep -n 'getPhysicalMode' apps/openmw/mwlua/camerabindings.cpp
          grep -n 'getAnimationMode' apps/openmw/mwlua/camerabindings.cpp
          ! grep -R -n 'Mask_PlayerSecondaryView' apps/openmw/mwrender

          # CP1 itself is forbidden from touching ObjectPaging; inheritance comes from the exact V3.21 stack.
          ! grep -n '"apps/openmw/mwrender/objectpaging.cpp"' tools/v3/apply_v322_cp1_msoc_hotpath.py

      - name: Validate V3.22 CP1 generated hot path
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'openmw-custom-v3.22-cp1-msoc-hotpath' apps/openmw/engine.cpp
          grep -n 'OPENMW_V322_CP1_MSOC_HOT_PATH' apps/openmw/mwrender/occlusionculling.cpp
          grep -n 'mV322ViewInverse' components/sceneutil/occlusionculling.hpp
          grep -n 'hasCachedViewInverse' components/sceneutil/occlusionculling.hpp
          grep -n 'getCachedViewInverse' components/sceneutil/occlusionculling.hpp
          grep -n 'getCachedEyeWorld' components/sceneutil/occlusionculling.hpp
          grep -n 'mV322PagedDataNode' apps/openmw/mwrender/occlusionculling.hpp
          grep -n 'mV322PagedData' apps/openmw/mwrender/occlusionculling.hpp

          grep -n '135 = V3.22 CP1 final V3.21 CP4 behavior control' tools/v3/launchers/V3_Lab.ps1
          grep -n '136 = V3.22 CP1 MSOC hot-path cache' tools/v3/launchers/V3_Lab.ps1
          grep -n 'Enter a listed mode (1-127, 129-131, or 135-136)' tools/v3/launchers/V3_Lab.ps1
          grep -n "'135'.*V321CP2Fairness = '1'.*V321CP3FullBodyFirstPerson = '1'.*V321CP4ShadowCompat = '1'" tools/v3/launchers/V3_Lab.ps1
          grep -n "'136'.*V321CP2Fairness = '1'.*V321CP3FullBodyFirstPerson = '1'.*V321CP4ShadowCompat = '1'.*V322CP1MsocHotPath = '1'" tools/v3/launchers/V3_Lab.ps1
          ! grep -q "^[[:space:]]*'132'[[:space:]]*{" tools/v3/launchers/V3_Lab.ps1
          ! grep -q "^[[:space:]]*'133'[[:space:]]*{" tools/v3/launchers/V3_Lab.ps1
          ! grep -q "^[[:space:]]*'134'[[:space:]]*{" tools/v3/launchers/V3_Lab.ps1

          # First checkpoint may edit only the audited occlusion/identity code surfaces.
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('tools/v3/apply_v322_cp1_msoc_hotpath.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          targets = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == 'replace_exact':
                  if not node.args or not isinstance(node.args[0], ast.Constant) or not isinstance(node.args[0].value, str):
                      raise SystemExit('V3.22 CP1 has a non-literal replace_exact target')
                  targets.add(node.args[0].value)
          allowed = {
              'components/sceneutil/occlusionculling.hpp',
              'components/sceneutil/occlusionculling.cpp',
              'apps/openmw/mwrender/occlusionculling.hpp',
              'apps/openmw/mwrender/occlusionculling.cpp',
              'apps/openmw/engine.cpp',
          }
          if not targets or not targets <= allowed:
              raise SystemExit(f'V3.22 CP1 target drift: {sorted(targets - allowed)}')
          print('V3.22 CP1 audited replace_exact targets:', sorted(targets))
          PY

          ! grep -R -n -E 'markV322CompileClass|OpenMW\.V322CompileClass\.|osg::DummyObject' \
            apps/openmw/mwrender/occlusionculling.cpp components/sceneutil/occlusionculling.cpp

      - name: Parse-check generated PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/v3/launchers/V3_Lab.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'V3_Lab.ps1 parse check passed.'

      - name: Upload exact generated V3.22 source
        uses: actions/upload-artifact@v4
        with:
          name: v322-preflight-applied-source-${{ github.sha }}
          path: |
            V3-applied-source.patch
            V3-applied-source-stat.txt
            V3-LAB-README.txt
            V3-BUILD-IDENTITY.txt
            tools/v3/V322-CP1-SOURCE-AUDIT.txt
          if-no-files-found: error

  Windows:
    needs: Preflight
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'full') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-build]')) }}
    uses: ./.github/workflows/windows.yml
    with:
      image: '2022'
      tests: false
