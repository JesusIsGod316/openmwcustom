name: V3.19 CPU critical path build/QC

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run source preflight or full Windows build'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - full
  push:
    branches:
      - v3.19-donor-cpu-pack

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  Preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Show exact source revision
        shell: bash
        run: |
          git rev-parse HEAD
          git status --short

      - name: Compile-check all V3 Python patch tools
        shell: bash
        run: python3 -m py_compile tools/v3/*.py

      - name: Apply complete V3.19 generated source stack through production router
        shell: bash
        run: |
          set +e
          python3 tools/v3/apply_diagnostic_harness.py 2>&1 | tee v319-apply.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload V3.19 apply log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v319-apply-log-${{ github.sha }}
          path: v319-apply.log
          if-no-files-found: error

      - name: Validate generated V3.19 P1 markers and build identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cat V3-applied-source-stat.txt
          cat V3-BUILD-IDENTITY.txt
          grep -Fx 'branch=v3.19-donor-cpu-pack' V3-BUILD-IDENTITY.txt
          grep -Fx 'version=V3.19' V3-BUILD-IDENTITY.txt
          grep -Fx 'harness=apply_diagnostic_harness_v319.py' V3-BUILD-IDENTITY.txt
          grep -Fx 'routing=exact-fail-closed' V3-BUILD-IDENTITY.txt
          grep -Fx 'generated_source_identity=passed' V3-BUILD-IDENTITY.txt
          grep -n 'OPENMW_V319_FOCUS_CADENCE' apps/openmw/engine.cpp
          grep -n 'frameNumber % v319FocusCadence' apps/openmw/engine.cpp
          grep -n 'openmw-custom-v3.19-cpu-p1' apps/openmw/engine.cpp
          grep -n 'OPENMW_V319_STATIC_INSTANCING' apps/openmw/mwrender/objectpaging.cpp
          grep -n 'setNumInstances' apps/openmw/mwrender/objectpaging.cpp
          grep -n 'GL_ARB_draw_instanced' files/shaders/compatibility/objects.vert
          grep -n 'v319StaticInstanceMatrix' files/shaders/compatibility/bs/default.vert
          grep -n 'v319StaticInstanceMatrix' files/shaders/compatibility/shadowcasting.vert
          grep -n '109 = V3.19 P1 conservative static instancing' tools/v3/launchers/V3_Lab.ps1
          grep -n '110 = V3.19 P1 aggressive static instancing' tools/v3/launchers/V3_Lab.ps1
          grep -n 'Enter 1 through 110' tools/v3/launchers/V3_Lab.ps1
          grep -n 'mNisScaler->dispatch' apps/openmw/mwrender/pingpongcanvas.cpp
          grep -n 'mV35CoarseChunkOcclusion' components/settings/categories/camera.hpp

      - name: Validate V3.19 P1 policy invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          engine = Path('apps/openmw/engine.cpp').read_text(encoding='utf-8')
          objectpaging = Path('apps/openmw/mwrender/objectpaging.cpp').read_text(encoding='utf-8')
          launcher = Path('tools/v3/launchers/V3_Lab.ps1').read_text(encoding='utf-8')
          patch = Path('V3-applied-source.patch').read_text(encoding='utf-8', errors='replace')
          readme = Path('V3-LAB-README.txt').read_text(encoding='utf-8')
          identity = Path('V3-BUILD-IDENTITY.txt').read_text(encoding='utf-8')
          assert engine.count('OPENMW_V319_FOCUS_CADENCE') == 1
          assert 'mWindowManager->isGuiMode()' in engine
          assert 'Activation/input queries remain untouched.' in engine
          assert 'openmw-custom-v3.19-cpu-p1' in engine
          assert objectpaging.count('OPENMW_V319_STATIC_INSTANCING') == 1
          assert 'setNumInstances' in objectpaging
          assert 'v319CandidatePair' in objectpaging
          for token in ('v319-cpu-control','v319-focus2',
                        'v319-p1-instancing-conservative','v319-p1-instancing-aggressive',
                        'Enter 1 through 110','OPENMW_V319_STATIC_INSTANCING'):
              assert token in launcher, token
          for shader in ('files/shaders/compatibility/objects.vert',
                         'files/shaders/compatibility/bs/default.vert',
                         'files/shaders/compatibility/bs/nolighting.vert',
                         'files/shaders/compatibility/shadowcasting.vert'):
              text = Path(shader).read_text(encoding='utf-8')
              assert 'GL_ARB_draw_instanced' in text, shader
              assert 'v319StaticInstanceMatrix' in text, shader
          assert 'mNisScaler->dispatch' in patch
          assert 'mV35CoarseChunkOcclusion' in patch
          assert 'V3.19 CPU critical path P1' in readme
          for token in ('branch=v3.19-donor-cpu-pack', 'version=V3.19',
                        'harness=apply_diagnostic_harness_v319.py',
                        'routing=exact-fail-closed', 'generated_source_identity=passed'):
              assert token in identity, token
          print('V3.19 P1 CPU and artifact-identity policy invariants passed.')
          PY

      - name: Parse-check generated PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/v3/launchers/V3_Lab.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'V3_Lab.ps1 parse check passed.'

      - name: Upload exact generated V3.19 patch and identity
        uses: actions/upload-artifact@v4
        with:
          name: v319-preflight-applied-source-${{ github.sha }}
          path: |
            V3-applied-source.patch
            V3-applied-source-stat.txt
            V3-BUILD-IDENTITY.txt
            V3-LAB-README.txt
            V3.18-RENDER-LAYER.txt
            V3.18-NIS-PROVENANCE.txt
          if-no-files-found: error

  Windows:
    needs: Preflight
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'full') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-build]')) }}
    uses: ./.github/workflows/windows.yml
    with:
      image: '2022'
      tests: false
