name: V4.0 CP3C runtime integration QC

on:
  workflow_dispatch:
  push:
    branches: [v4.0-cp3c-runtime-integration]

concurrency:
  group: v4-cp3c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  OwnershipContracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CP3C head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact accepted CP3B ancestry
        shell: bash
        run: |
          set -euo pipefail
          CP3B_BASE=e11cb067eafc30972655a8836376320256c33159
          git cat-file -e "${CP3B_BASE}^{commit}"
          test "$(git merge-base "${CP3B_BASE}" HEAD)" = "${CP3B_BASE}"

      - name: Enforce neutral RenderCore purity and compatibility gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '#include[[:space:]]*[<"](osg|osgViewer|osgUtil|vsg|vulkan|apps/openmw|components/mwworld|components/nif)|\b(osg|osgViewer|osgUtil|vsg)::|\bVk[A-Z]|\bMWWorld::|\bNif::' components/rendercore; then
            echo 'RenderCore common boundary contains a forbidden backend/game/source-format dependency' >&2
            exit 1
          fi
          grep -F 'RenderCompatibilityFacet::ShaderModSurface' components/rendercore/backendselection.hpp
          grep -F 'RequiredAutomaticVsgCompatibility' components/rendercore/backendselection.hpp
          grep -F 'FogDistanceMode fogDistanceMode' components/rendercore/framerenderstate.hpp
          grep -F 'FogFalloffMode fogFalloffMode' components/rendercore/framerenderstate.hpp
          grep -F 'bool fogEnabled = false' components/rendercore/framerenderstate.hpp
          grep -F 'bool sunLightEnabled = true' components/rendercore/framerenderstate.hpp
          grep -F 'bool localLightRadiusFade = true' components/rendercore/framerenderstate.hpp
          grep -F 'bool clusteredLocalLighting = false' components/rendercore/framerenderstate.hpp
          grep -F 'upsertLight(const CellLightSource& source)' components/rendercore/activecellproducer.hpp
          grep -F 'batch.add(RetireLight{ binding.handle })' components/rendercore/activecellproducer.hpp
          grep -F 'semantic_detail::finite(record.position)' components/rendercore/renderworld.hpp

      - name: Install lightweight compile dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglm-dev libvulkan-dev

      - name: Prepare exact VSG 1.1.15 headers
        shell: bash
        run: |
          set -euo pipefail
          VSG_COMMIT=599a8c5c61cbb993079261b2ada99bd843badf5b
          git init /tmp/vsg-1.1.15
          git -C /tmp/vsg-1.1.15 remote add origin https://github.com/vsg-dev/VulkanSceneGraph.git
          git -C /tmp/vsg-1.1.15 fetch --depth 1 origin "${VSG_COMMIT}"
          git -C /tmp/vsg-1.1.15 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/vsg-1.1.15 rev-parse HEAD)" = "${VSG_COMMIT}"
          cmake -S /tmp/vsg-1.1.15 -B /tmp/vsg-1.1.15-build \
            -DVSG_BUILD_TESTS=OFF -DVSG_SUPPORTS_Windowing=OFF
          SDL_COMMIT=8e37db5e797b6167f3a00d697d816a684bd259c7
          git init /tmp/SDL-3.4.10
          git -C /tmp/SDL-3.4.10 remote add origin https://github.com/libsdl-org/SDL.git
          git -C /tmp/SDL-3.4.10 fetch --depth 1 origin "${SDL_COMMIT}"
          git -C /tmp/SDL-3.4.10 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/SDL-3.4.10 rev-parse HEAD)" = "${SDL_COMMIT}"

      - name: Compile and run CP3C ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          common=(-std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -I.)
          g++ "${common[@]}" tools/v4/cp3c/static-world-plan-smoke.cpp -o /tmp/v4-cp3c-static-world-plan-smoke
          /tmp/v4-cp3c-static-world-plan-smoke
          g++ "${common[@]}" tools/v4/cp3c/frame-lifetime-smoke.cpp -o /tmp/v4-cp3c-frame-lifetime-smoke
          /tmp/v4-cp3c-frame-lifetime-smoke
          g++ "${common[@]}" tools/v4/cp3c/backend-selection-smoke.cpp -o /tmp/v4-cp3c-backend-selection-smoke
          /tmp/v4-cp3c-backend-selection-smoke
          g++ "${common[@]}" tools/v4/cp3c/frame-producer-smoke.cpp -o /tmp/v4-cp3c-frame-producer-smoke
          /tmp/v4-cp3c-frame-producer-smoke
          g++ "${common[@]}" tools/v4/cp3c/active-cell-producer-smoke.cpp \
            -o /tmp/v4-cp3c-active-cell-producer-smoke
          /tmp/v4-cp3c-active-cell-producer-smoke
          g++ "${common[@]}" tools/v4/cp3c/local-light-plan-smoke.cpp \
            -o /tmp/v4-cp3c-local-light-plan-smoke
          /tmp/v4-cp3c-local-light-plan-smoke
          g++ "${common[@]}" tools/v4/cp3c/static-model-cache-smoke.cpp \
            -o /tmp/v4-cp3c-static-model-cache-smoke
          /tmp/v4-cp3c-static-model-cache-smoke
          g++ "${common[@]}" tools/v4/cp3c/scene-render-lifecycle-smoke.cpp \
            -o /tmp/v4-cp3c-scene-render-lifecycle-smoke
          /tmp/v4-cp3c-scene-render-lifecycle-smoke
          g++ "${common[@]}" tools/v4/cp3c/render-route-status-smoke.cpp \
            -o /tmp/v4-cp3c-render-route-status-smoke
          /tmp/v4-cp3c-render-route-status-smoke
          g++ "${common[@]}" -I/tmp/vsg-1.1.15/include -I/tmp/vsg-1.1.15-build/include \
            tools/v4/cp3c/frame-camera-smoke.cpp -o /tmp/v4-cp3c-frame-camera-smoke
          /tmp/v4-cp3c-frame-camera-smoke
          printf '#include <components/render/backend/vsg/vsgsubmission.hpp>\n' |
            g++ "${common[@]}" -I/tmp/vsg-1.1.15/include -I/tmp/vsg-1.1.15-build/include \
              -x c++ -c -o /tmp/v4-cp3c-vsgsubmission.o -
          printf '#include <components/render/backend/vsg/framecamera.hpp>\n' |
            g++ "${common[@]}" -I/tmp/vsg-1.1.15/include -I/tmp/vsg-1.1.15-build/include \
              -x c++ -c -o /tmp/v4-cp3c-framecamera.o -
          g++ "${common[@]}" -I/tmp/vsg-1.1.15/include -I/tmp/vsg-1.1.15-build/include \
              -c components/render/backend/vsg/vsgruntimehost.cpp -o /tmp/v4-cp3c-runtime-host.o
          g++ "${common[@]}" -I/tmp/vsg-1.1.15/include -I/tmp/vsg-1.1.15-build/include \
              -c components/render/backend/vsg/openmwviewdependentstate.cpp \
              -o /tmp/v4-cp3c-openmw-view-state.o
          g++ "${common[@]}" -I/tmp/SDL-3.4.10/include \
              -I/tmp/vsg-1.1.15/include -I/tmp/vsg-1.1.15-build/include \
              -c components/render/backend/vsg/vsgruntimebootstrap.cpp -o /tmp/v4-cp3c-runtime-bootstrap.o
          g++ "${common[@]}" -I/tmp/SDL-3.4.10/include \
              -I/tmp/vsg-1.1.15/include -I/tmp/vsg-1.1.15-build/include \
              -c components/render/backend/vsg/vsgsemanticsession.cpp -o /tmp/v4-cp3c-semantic-session.o

      - name: Verify production startup selection seam
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'renderer backend = auto' files/settings-default.cfg
          grep -F 'renderer fallback = true' files/settings-default.cfg
          grep -F 'selectConfiguredRenderBackend()' apps/openmw/engine.cpp
          grep -F '#include <components/rendercore/backendselection.hpp>' apps/openmw/engine.cpp
          grep -F 'prepareVirtualFileSystem();' apps/openmw/engine.cpp
          grep -F 'VFS::registerArchives(vfs.get()' apps/openmw/engine.cpp
          grep -F '.vsgVulkan = false' apps/openmw/engine.cpp
          grep -F 'Selected renderer has no engine bootstrap path' apps/openmw/engine.cpp
          if grep -F 'v4semanticsource' apps/openmw/CMakeLists.txt; then
            echo 'GLM-backed V4 source adapter leaked into the legacy OpenGL target graph' >&2
            exit 1
          fi
          if grep -F 'v4scenerenderlifecycle' apps/openmw/CMakeLists.txt; then
            echo 'VSG lifecycle adapter leaked into the legacy OpenGL target graph' >&2
            exit 1
          fi
          if grep -F 'v4enginerenderbridge' apps/openmw/CMakeLists.txt; then
            echo 'VSG engine bridge leaked into the legacy OpenGL target graph' >&2
            exit 1
          fi
          grep -F 'openmw-v4-semantic-source-compile' tools/v4/cp3b3/OpenMWRealNifTool.cmake
          grep -F 'v4enginerenderbridge.cpp' tools/v4/cp3b3/OpenMWRealNifTool.cmake
          grep -F 'makeV4StaticInstanceSource' apps/openmw/mwrender/v4semanticsource.cpp
          grep -F 'makeV4CellLightSource' apps/openmw/mwrender/v4semanticsource.cpp
          grep -F 'SceneUtil::resolveLightAttenuation' apps/openmw/mwrender/v4semanticsource.cpp
          grep -F 'makeV4InteriorEnvironmentState' apps/openmw/mwrender/v4semanticsource.cpp
          grep -F 'result.clusteredLocalLighting = Settings::shaders().mClusteredLighting;' apps/openmw/mwrender/v4semanticsource.cpp
          grep -F 'resolveCellLighting(cell)' apps/openmw/mwrender/v4semanticsource.cpp
          grep -F 'const FogManager::State fog = mFog->getState(isUnderwater)' apps/openmw/mwrender/renderingmanager.cpp
          grep -F 'environment.sunLightEnabled ? 1.0f : 0.0f' components/render/backend/vsg/vsgruntimehost.cpp
          grep -F 'mOpenMwViewState->setEnvironment(environment, mainView->current.projection);' components/render/backend/vsg/vsgruntimehost.cpp
          grep -F 'makeV4MainCameraState' apps/openmw/mwrender/v4semanticsource.cpp
          grep -F 'V4EngineRenderBridge::takeSceneRenderLifecycle' apps/openmw/mwrender/v4enginerenderbridge.cpp
          grep -F 'V4EngineRenderBridge::renderMainFrame' apps/openmw/mwrender/v4enginerenderbridge.cpp
          grep -F 'SDL_GetWindowSizeInPixels' apps/openmw/mwrender/v4enginerenderbridge.cpp
          grep -F 'if (!mRouteStatus->healthy())' apps/openmw/mwrender/v4enginerenderbridge.cpp
          grep -F 'V4SceneRenderLifecycle::publishStaticObject' apps/openmw/mwrender/v4scenerenderlifecycle.cpp
          grep -F 'mSession->cells().upsertLight' apps/openmw/mwrender/v4scenerenderlifecycle.cpp
          grep -F 'std::shared_ptr<RenderVsg::VsgSemanticSession> mSession' apps/openmw/mwrender/v4scenerenderlifecycle.hpp
          grep -F 'mRouteStatus->fail(message)' apps/openmw/mwrender/v4scenerenderlifecycle.cpp
          grep -F 'translateStaticNif' apps/openmw/mwrender/v4scenerenderlifecycle.cpp
          grep -F 'VsgRuntimeBootstrap::create' components/render/backend/vsg/vsgruntimebootstrap.cpp
          grep -F 'VsgSemanticSession::create' components/render/backend/vsg/vsgsemanticsession.cpp
          grep -F 'std::unique_ptr<SceneRenderLifecycle> renderLifecycle = {}' apps/openmw/mwworld/worldimp.hpp
          grep -F '#include "scenerenderlifecycle.hpp"' apps/openmw/mwworld/scene.hpp
          grep -F 'mRenderLifecycle->cellActivated(cell)' apps/openmw/mwworld/scene.cpp
          grep -F 'mRenderLifecycle->cellDeactivating(*cell)' apps/openmw/mwworld/scene.cpp
          grep -F 'mRenderLifecycle->objectChanged(ptr)' apps/openmw/mwworld/scene.cpp
          grep -F 'mRenderLifecycle->worldResetting()' apps/openmw/mwworld/scene.cpp
          grep -F -- '--runtime-host' tools/v4/cp3b3/nif-conformance.cpp

      - name: Retain relevant CP3B neutral planning regressions
        shell: bash
        run: |
          set -euo pipefail
          common=(-std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -I.)
          for source in \
            tools/v4/cp3b/rendercore-semantic-smoke.cpp \
            tools/v4/cp3b/static-asset-plan-smoke.cpp \
            tools/v4/cp3b/static-sort-policy-smoke.cpp \
            tools/v4/cp3b/texture-identity-smoke.cpp; do
            output="/tmp/$(basename "${source}" .cpp)"
            g++ "${common[@]}" "${source}" -o "${output}"
            "${output}"
          done

      - name: Check changed-source whitespace
        run: git diff --check e11cb067eafc30972655a8836376320256c33159 HEAD -- .

  OpenGLControlWindows:
    uses: ./.github/workflows/windows.yml
    with:
      image: '2022'
      tests: true
      package: false

  RuntimeVulkanWindows:
    uses: ./.github/workflows/v4-cp3b3.yml
    with:
      force_run: true
