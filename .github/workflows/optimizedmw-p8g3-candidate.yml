name: OptimizedMW P8G3 deployed PBR validation
on:
  push:
    branches: [optimizedmw/gl-p8g3-visibility-lod]
    paths: [.github/workflows/optimizedmw-p8g3-candidate.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  Candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and materialize deployment repair
        env:
          CANDIDATE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-4f34-81f5-a565-3946294ff184/raw?se=2026-09-28T04%3A08%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=d47f7f0c-7265-51df-97aa-0c34d912e6d1&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A24%3A11Z&ske=2026-09-29T00%3A24%3A11Z&sks=b&skv=2026-02-06&sig=ws08FGm6mamCtH1dJ3Y3ggX%2BPRnkytthfaS3YD0ZEXg%3D'
        run: |
          set -euo pipefail
          curl --fail --retry 2 "$CANDIDATE_URL" -o /tmp/candidate.zip
          echo '6168881b3c6f51f5a878e60853a09cedfe0a78e429c1b9e8fe37d21580a31586  /tmp/candidate.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile,json,hashlib,pathlib,subprocess
          z=zipfile.ZipFile('/tmp/candidate.zip')
          assert set(z.namelist()) == {'candidate.patch','manifest.json','parent.txt'}
          assert z.read('parent.txt').decode().strip() == '90182a5228656bf1435b74267c72a7ce3073dd5c'
          subprocess.run(['git','merge-base','--is-ancestor',z.read('parent.txt').decode().strip(),'HEAD'],check=True)
          manifest=json.loads(z.read('manifest.json'))
          for name,checks in manifest.items():
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts and not str(p).startswith('.git')
              actual=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert actual == checks['before_sha256'], (name,actual,'source changed')
          pathlib.Path('/tmp/candidate.patch').write_bytes(z.read('candidate.patch'))
          pathlib.Path('/tmp/manifest.json').write_bytes(z.read('manifest.json'))
          subprocess.run(['git','apply','--index','/tmp/candidate.patch'],check=True)
          for name,checks in manifest.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == checks['after_sha256'],name
          print('Verified and materialized',len(manifest),'deployment repair files')
          PY
      - name: Install native graphics dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libopenscenegraph-dev libmygui-dev libbullet-dev libglm-dev libboost-dev libyaml-cpp-dev libgl1-mesa-dev xvfb xauth
      - name: Retained contracts and launcher parsing
        run: |
          set -euo pipefail
          for p in 3 4 6 7 8 8g2 8g3; do python tools/optimizedmw/gl-p$p/source-contract.py; done
          git diff --cached --check
      - name: Native and deployed PBR shader tests
        run: |
          set -o pipefail
          cmake -S tools/optimizedmw/gl-p8g3 -B build-p8g3 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DP8G3_SANITIZERS=ON
          cmake --build build-p8g3 --parallel 2 2>&1 | tee /tmp/p8g3-build.log
          ctest --test-dir build-p8g3 -V --output-on-failure
      - name: Publish only validated deployment repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'OptimizedMW P8G3: deploy audited PBR LOD and wind shaders with real package validation'
          git push origin HEAD:optimizedmw/gl-p8g3-visibility-lod
          git rev-parse HEAD > build-p8g3/published-commit.txt
          git rev-parse HEAD^{tree} > build-p8g3/published-tree.txt
      - name: Collect source and deployment evidence
        if: always()
        run: |
          mkdir -p /tmp/p8g3-evidence
          cp /tmp/candidate.zip /tmp/manifest.json /tmp/p8g3-build.log /tmp/p8g3-evidence/ 2>/dev/null || true
          cp build-p8g3/published-*.txt /tmp/p8g3-evidence/ 2>/dev/null || true
          cp build-p8g3/Testing/Temporary/LastTest.log /tmp/p8g3-evidence/ 2>/dev/null || true
          cp -r build-p8g3/deployed-shader-sources /tmp/p8g3-evidence/ 2>/dev/null || true
          cp build-p8g3/deployment/staged/resources/shaders/shader-package.json /tmp/p8g3-evidence/ 2>/dev/null || true
          git diff --cached --binary > /tmp/p8g3-evidence/unpublished.patch
          git ls-tree -r HEAD > /tmp/p8g3-evidence/blobs.txt
          tar czf /tmp/p8g3-evidence/source.tar.gz --exclude=.git --exclude=build-p8g3 .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OptimizedMW-P8G3-deployed-validation
          path: /tmp/p8g3-evidence/
          retention-days: 14
