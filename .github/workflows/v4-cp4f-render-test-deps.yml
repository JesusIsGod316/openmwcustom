name: CP4F renderer test dependencies
on:
  push:
    branches: [v4.0-cp4f-rendering-repair-20260922]
    paths: [.github/workflows/v4-cp4f-render-test-deps.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install compiler and native headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ninja-build libvulkan-dev glslang-dev glslang-tools spirv-tools libopenscenegraph-dev libglm-dev libbullet-dev libboost-all-dev libluajit-5.1-dev libpng-dev libsqlite3-dev libyaml-cpp-dev librecast-dev libopenal-dev libavcodec-dev libavformat-dev libswscale-dev libswresample-dev libfreetype-dev qt6-base-dev python3-yaml
      - name: Prepare exact source versions
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/render-deps"
          mkdir -p "$d"
          git init "$d/vsg"
          git -C "$d/vsg" remote add origin https://github.com/vsg-dev/VulkanSceneGraph.git
          git -C "$d/vsg" fetch --depth 1 origin 599a8c5c61cbb993079261b2ada99bd843badf5b
          git -C "$d/vsg" checkout --detach FETCH_HEAD
          git init "$d/vsgXchange"
          git -C "$d/vsgXchange" remote add origin https://github.com/vsg-dev/vsgXchange.git
          git -C "$d/vsgXchange" fetch --depth 1 origin 999c04de9fe268bdf0e0956613f1cbdec9da5970
          git -C "$d/vsgXchange" checkout --detach FETCH_HEAD
          git init "$d/mygui"
          git -C "$d/mygui" remote add origin https://github.com/MyGUI/mygui.git
          git -C "$d/mygui" fetch --depth 1 origin dae9ac4be5a09e672bec509b1a8552b107c40214
          git -C "$d/mygui" checkout --detach FETCH_HEAD
          curl --fail --location --retry 2 -o "$d/sdl.zip" https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-devel-3.4.10-VC.zip
          echo "e2b336b10b037934af98308027410732ef7b22f2c6697d58092aa1c209fae7d7  $d/sdl.zip" | sha256sum --check
          unzip -q "$d/sdl.zip" -d "$d"
          for repo in vsg vsgXchange mygui; do echo "$repo $(git -C "$d/$repo" rev-parse HEAD)"; done | tee "$d/identities.txt"
      - name: Compile pinned VSG and built-in image readers
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/render-deps"
          cmake -S "$d/vsg" -B "$d/vsg-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$d/prefix" -DBUILD_SHARED_LIBS=OFF -DVSG_SUPPORTS_Windowing=OFF
          cmake --build "$d/vsg-build" --parallel 3
          cmake --install "$d/vsg-build"
          cmake -S "$d/vsgXchange" -B "$d/xchange-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$d/prefix" -DCMAKE_PREFIX_PATH="$d/prefix" -DBUILD_SHARED_LIBS=OFF -DvsgXchange_assimp=OFF -DvsgXchange_curl=OFF -DvsgXchange_freetype=OFF -DvsgXchange_GDAL=OFF -DvsgXchange_openexr=OFF -DvsgXchange_ktx=OFF -DCMAKE_DISABLE_FIND_PACKAGE_osg2vsg=ON
          cmake --build "$d/xchange-build" --parallel 3
          cmake --install "$d/xchange-build"
      - name: Archive reusable offline test SDK
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/render-deps"
          mkdir -p "$d/sysroot/usr/include" "$d/sysroot/usr/lib/x86_64-linux-gnu" "$d/sysroot/usr/bin"
          python3 - <<'PY'
          import os,pathlib,shutil,subprocess
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'render-deps'
          packages=['libvulkan-dev','glslang-dev','spirv-tools','glslang-tools','libopenscenegraph-dev','libopenthreads-dev','libglm-dev','libbullet-dev','libboost1.83-dev','libluajit-5.1-dev','libpng-dev','libsqlite3-dev','libyaml-cpp-dev','librecast-dev','libopenal-dev','libavcodec-dev','libavformat-dev','libswscale-dev','libswresample-dev','libavutil-dev','libfreetype-dev']
          for pkg in packages:
              proc=subprocess.run(['dpkg-query','-L',pkg],text=True,capture_output=True)
              if proc.returncode: print('No exported files for',pkg); continue
              for raw in proc.stdout.splitlines():
                  p=pathlib.Path(raw)
                  wanted=raw.startswith('/usr/include/') or (raw.startswith('/usr/lib/') and p.suffix in ['.a','.cmake']) or raw in ['/usr/bin/glslangValidator','/usr/bin/spirv-val','/usr/bin/spirv-dis']
                  if wanted and p.is_file():
                      dest=d/'sysroot'/raw.lstrip('/'); dest.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,dest)
          PY
          find "$d" -type d -name .git -prune -exec rm -rf {} +
          rm -f "$d/sdl.zip"
          tar -C "$d" -czf "$RUNNER_TEMP/cp4f-render-test-deps.tar.gz" prefix sysroot vsg vsg-build/include vsgXchange mygui SDL3-3.4.10/include identities.txt
          sha256sum "$RUNNER_TEMP/cp4f-render-test-deps.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp4f-render-test-deps
          path: ${{ runner.temp }}/cp4f-render-test-deps.tar.gz
          retention-days: 7
          if-no-files-found: error
