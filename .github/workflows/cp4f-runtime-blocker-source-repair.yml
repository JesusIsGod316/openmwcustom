name: CP4F runtime blocker source repair

on:
  push:
    branches:
      - automation/cp4f-runtime-blocker-repair
    paths:
      - .github/workflows/cp4f-runtime-blocker-source-repair.yml

permissions:
  contents: write

jobs:
  apply-source-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded CP4F source repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v4.0-cp4f-exterior-closeout
          git checkout -B cp4f-runtime-repair origin/v4.0-cp4f-exterior-closeout
          python3 - <<'PY'
          from pathlib import Path

          bridge = Path("apps/openmw/mwrender/v4enginerenderbridge.cpp")
          text = bridge.read_text()

          epoch_anchor = "            mComposedActors.clear();"
          if text.count(epoch_anchor) != 1:
              raise SystemExit(f"bridge epoch anchor count={text.count(epoch_anchor)}")
          text = text.replace(
              epoch_anchor,
              "            mForcedActorSkeletons.clear();\n" + epoch_anchor,
              1,
          )

          actor_start = text.index(
              "            const std::optional<NifRender::StaticModelCacheResult> base\n"
              "                = ensureModelPublished(*mSession, mVfs, animation.getV4SourceModel());"
          )
          actor_end_anchor = "            RenderCore::ModelHandle actorModel = base->model;"
          actor_end = text.index(actor_end_anchor, actor_start) + len(actor_end_anchor)
          actor_replacement = "\n".join([
              "            const std::optional<NifRender::StaticModelCacheResult> base",
              "                = ensureModelPublished(*mSession, mVfs, animation.getV4SourceModel());",
              "            if (!base)",
              "            {",
              "                compatible = false;",
              "                mLastDiagnostic = \"active actor source model could not be published\";",
              "                return;",
              "            }",
              "            const RenderCore::ModelRecord* const baseRecord = mSession->world().get(base->model);",
              "            if (!baseRecord || !baseRecord->payload)",
              "            {",
              "                compatible = false;",
              "                mLastDiagnostic = \"active actor source model has no current canonical model payload\";",
              "                return;",
              "            }",
              "",
              "            std::optional<RenderCore::SkeletonHandle> actorSkeleton = base->skeleton;",
              "            if (!actorSkeleton)",
              "            {",
              "                const std::string skeletonIdentity(animation.getV4SourceModel().value());",
              "                const auto cached = mForcedActorSkeletons.find(skeletonIdentity);",
              "                if (cached != mForcedActorSkeletons.end() && mSession->world().get(cached->second))",
              "                    actorSkeleton = cached->second;",
              "                else",
              "                {",
              "                    NifRender::ForcedActorSkeleton forced = NifRender::buildForcedActorSkeleton(",
              "                        *baseRecord, \"runtime:forced-actor-skeleton:\" + skeletonIdentity);",
              "                    if (!forced.valid())",
              "                    {",
              "                        compatible = false;",
              "                        mLastDiagnostic = \"active actor source model cannot reproduce OpenMW's forced skeleton: \"",
              "                            + forced.diagnostic;",
              "                        return;",
              "                    }",
              "                    const std::optional<RenderCore::SkeletonHandle> reserved",
              "                        = mSession->world().reserveSkeleton();",
              "                    if (!reserved)",
              "                    {",
              "                        compatible = false;",
              "                        mLastDiagnostic = \"forced actor skeleton handle reservation failed\";",
              "                        return;",
              "                    }",
              "                    RenderCore::RenderWorldUpdateBatch batch(mSession->world().epoch(),",
              "                        mSession->publisher().nextSequence(), forced.record.sourceIdentity);",
              "                    if (!batch.add(RenderCore::CreateSkeleton{ *reserved, std::move(forced.record) })",
              "                        || !batch.seal()",
              "                        || mSession->publisher().apply(batch) != RenderCore::PublishStatus::Applied)",
              "                    {",
              "                        mSession->world().cancel(*reserved);",
              "                        compatible = false;",
              "                        mLastDiagnostic = \"forced actor skeleton publication failed\";",
              "                        return;",
              "                    }",
              "                    mForcedActorSkeletons.insert_or_assign(skeletonIdentity, *reserved);",
              "                    actorSkeleton = *reserved;",
              "                }",
              "            }",
              "            RenderCore::ModelHandle actorModel = base->model;",
          ])
          text = text[:actor_start] + actor_replacement + text[actor_end:]

          compose_old = "mSession->world(), base->model, *base->skeleton, parts, \"runtime:npc:\" + *identity);"
          compose_new = "mSession->world(), base->model, *actorSkeleton, parts, \"runtime:npc:\" + *identity);"
          if text.count(compose_old) != 1:
              raise SystemExit(f"compose skeleton anchor count={text.count(compose_old)}")
          text = text.replace(compose_old, compose_new, 1)

          compare_old = "bound->skeleton != base->skeleton"
          if text.count(compare_old) != 1:
              raise SystemExit(f"instance skeleton compare anchor count={text.count(compare_old)}")
          text = text.replace(compare_old, "bound->skeleton != actorSkeleton", 1)

          source_old = "makeV4DynamicInstanceSource(ptr, actorModel, *base->skeleton, modelRecord->bounds)"
          if text.count(source_old) != 1:
              raise SystemExit(f"dynamic source skeleton anchor count={text.count(source_old)}")
          text = text.replace(
              source_old,
              "makeV4DynamicInstanceSource(ptr, actorModel, *actorSkeleton, modelRecord->bounds)",
              1,
          )
          bridge.write_text(text)

          engine = Path("apps/openmw/engine.cpp")
          text = engine.read_text()
          route_start = text.index(
              "    MWRender::RenderingManager* rendering = mWorld ? mWorld->getRenderingManager() : nullptr;\n"
              "    MWWorld::CellStore* current = rendering ? mWorld->getWorldScene().getCurrentCell() : nullptr;"
          )
          route_end = text.index("\n\n    if (result == RenderCore::RenderFrameResult::Failed)", route_start)
          route_replacement = "\n".join([
              "    MWRender::RenderingManager* rendering = mWorld ? mWorld->getRenderingManager() : nullptr;",
              "    MWWorld::CellStore* current = rendering ? mWorld->getWorldScene().getCurrentCell() : nullptr;",
              "    const bool lifecycleReady = mV4RenderBridge->sceneRenderLifecycleTaken();",
              "    const bool gameplayRunning",
              "        = mStateManager && mStateManager->getState() == MWBase::StateManager::State_Running;",
              "",
              "    // New-game transitions can establish the authoritative player cell",
              "    // before WorldScene::mCurrentCell catches up. Do not silently keep",
              "    // presenting a GUI-only black frame when the player already owns a",
              "    // valid gameplay cell; use the same CellStore as the gameplay route.",
              "    if (rendering && lifecycleReady && gameplayRunning && (!current || !current->getCell()))",
              "    {",
              "        const MWWorld::Ptr player = mWorld->getPlayerPtr();",
              "        if (!player.isEmpty() && player.getCell() && player.getCell()->getCell())",
              "            current = player.getCell();",
              "    }",
              "",
              "    if (rendering && current && current->getCell() && lifecycleReady)",
              "    {",
              "        result = mV4FrameCoordinator->render(",
              "            *rendering, *current->getCell(), simulationTime, frameDelta, invalidateHistory);",
              "    }",
              "    else",
              "        result = mV4RenderBridge->renderGuiFrame(simulationTime, frameDelta);",
          ])
          text = text[:route_start] + route_replacement + text[route_end:]
          engine.write_text(text)
          PY

          git diff --check
          grep -F 'mForcedActorSkeletons.clear();' apps/openmw/mwrender/v4enginerenderbridge.cpp
          grep -F 'buildForcedActorSkeleton' apps/openmw/mwrender/v4enginerenderbridge.cpp
          grep -F '*actorSkeleton, parts' apps/openmw/mwrender/v4enginerenderbridge.cpp
          grep -F 'player.getCell()->getCell()' apps/openmw/engine.cpp
          ! grep -F 'active actor source model has no publishable canonical skeleton' apps/openmw/mwrender/v4enginerenderbridge.cpp

          git config user.name 'Chance'
          git config user.email 'l.s.chance2000@gmail.com'
          git add apps/openmw/mwrender/v4enginerenderbridge.cpp apps/openmw/engine.cpp
          git commit -m 'CP4F: repair forced actor skeleton and new-game cell route [skip ci]'
          git push origin HEAD:v4.0-cp4f-exterior-closeout
