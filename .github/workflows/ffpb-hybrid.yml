name: Full-body first-person hybrid OpenGL checkpoint
on:
  push:
    branches: [codex/ffpb-hybrid-animation]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  Source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify retained OpenGL source foundations
        run: |
          python tools/ffpb/verify-foundation.py
          python tools/opimizedmw/gl-p1b/check-integration.py
          python tools/v4/V4-CP0A-Verify-Materialized-Generated-Outputs.py
  Windows:
    needs: Source
    uses: ./.github/workflows/windows.yml
    with:
      image: '2022'
      tests: true
      package: false
