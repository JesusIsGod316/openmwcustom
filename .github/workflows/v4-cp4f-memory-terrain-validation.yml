name: CP4F combined memory terrain source validation
on:
  push:
    branches: [v4.0-cp4f-memory-terrain-repair-20260922]
    paths: [.github/workflows/v4-cp4f-memory-terrain-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed implementation bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 3de01e9b4804bcec940a9aef3f71b96035c5b25f HEAD)" = 3de01e9b4804bcec940a9aef3f71b96035c5b25f
          mkdir -p "$RUNNER_TEMP/combined-validation"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'combined-validation'
          shas = ['44ff6c12796dfc68347ad34cca2251bb22e2e9da','cae85da539ab2c93588540be037576c6164ee77d','a70073e589a10b3294ce1a30a14b7f2a88cbf7be','7dadfd099adce62a25dcd408519ce9147520efd1','bb407545496485c2f51915e87e3628a49d2a8b31','41f8f5fe02c91691b3c8c389bb8569d82c90afa4']
          packed = bytearray()
          for sha in shas:
              req = urllib.request.Request('https://api.github.com/repos/JesusIsGod316/openmwcustom/git/blobs/'+sha, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response: obj = json.load(response)
              data = base64.b64decode(obj['content'])
              assert hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest() == sha
              packed.extend(data)
          patch = lzma.decompress(packed)
          assert len(patch) == 123733
          assert hashlib.sha256(patch).hexdigest() == 'db29ce594eac994db959788f0195023e8654067ca3f2fa0ca71fb655f1066e40'
          paths = [line.split(' b/',1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')]
          assert len(paths) == 38 and len(set(paths)) == 38
          assert not any(p.startswith('.github/') or '/mwlua/' in p or '..' in p for p in paths)
          (out/'combined.patch').write_bytes(patch)
          (out/'paths.txt').write_text('\n'.join(paths)+'\n')
          subprocess.run(['git','apply','--check',str(out/'combined.patch')],check=True)
          subprocess.run(['git','apply','--index',str(out/'combined.patch')],check=True)
          print('Exact 38-file implementation applied; patch SHA256 verified')
          PY
      - name: Install real dependency headers and test libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libopenscenegraph-dev libglm-dev libbullet-dev libboost-all-dev libluajit-5.1-dev libpng-dev libsqlite3-dev libyaml-cpp-dev librecast-dev libopenal-dev libavcodec-dev libavformat-dev libswscale-dev libswresample-dev libvulkan-dev qt6-base-dev python3-yaml
      - name: Test memory policy and real OSG ownership reclamation
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combined-validation"
          bash tools/v4/cp4/run-host-memory-tests.sh "$out/native" 2>&1 | tee "$out/memory-native.log"
          OPENMW_UV_TEST_SANITIZERS=1 ASAN_OPTIONS=detect_leaks=1 bash tools/v4/cp4/run-host-memory-tests.sh "$out/sanitized" 2>&1 | tee "$out/memory-sanitized.log"
      - name: Retain UV recorder and launcher regressions
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combined-validation"
          bash tools/v4/cp4/run-effect-uv-tests.sh "$out/uv" 2>&1 | tee "$out/uv.log"
          bash tools/v4/cp4/run-runtime-diagnostics-tests.sh "$out/recorder" 2>&1 | tee "$out/recorder.log"
          python3 tools/v4/cp4/test-diagnostic-config.py 2>&1 | tee "$out/launcher.log"
          python3 tools/v4/cp4/test-gameplay-diagnostics.py 2>&1 | tee "$out/gameplay.log"
          cmake -S tools/v4/cp4/diagnostic-header-tests -B "$out/headers" -DOPENMW_DIAGNOSTIC_TEST_REAL_QT=ON
          cmake --build "$out/headers" --parallel 2
          ctest --test-dir "$out/headers" --output-on-failure 2>&1 | tee "$out/headers.log"
      - name: Prepare pinned VSG MyGUI and SDL headers
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/combined-deps"
          mkdir -p "$deps"
          git init "$deps/vsg"
          git -C "$deps/vsg" remote add origin https://github.com/vsg-dev/VulkanSceneGraph.git
          git -C "$deps/vsg" fetch --depth 1 origin 599a8c5c61cbb993079261b2ada99bd843badf5b
          git -C "$deps/vsg" checkout --detach FETCH_HEAD
          cmake -S "$deps/vsg" -B "$deps/vsg-build" -DVSG_BUILD_TESTS=OFF -DVSG_SUPPORTS_Windowing=OFF
          git init "$deps/mygui"
          git -C "$deps/mygui" remote add origin https://github.com/MyGUI/mygui.git
          git -C "$deps/mygui" fetch --depth 1 origin dae9ac4be5a09e672bec509b1a8552b107c40214
          git -C "$deps/mygui" checkout --detach FETCH_HEAD
          curl --fail --location --retry 2 -o "$deps/sdl.zip" https://github.com/libsdl-org/SDL/releases/download/release-3.4.10/SDL3-devel-3.4.10-VC.zip
          echo "e2b336b10b037934af98308027410732ef7b22f2c6697d58092aa1c209fae7d7  $deps/sdl.zip" | sha256sum --check
          unzip -q "$deps/sdl.zip" -d "$deps"
      - name: Compile actual changed production translation units
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combined-validation"
          deps="$RUNNER_TEMP/combined-deps"
          flags=(-std=c++20 -fsyntax-only -pthread -I. -Iextern/sol_config -Iextern/sol3 -Iextern/oics -isystem /usr/include/bullet -isystem /usr/include/recastnavigation -isystem /usr/include/luajit-2.1 -isystem "$deps/mygui/MyGUIEngine/include" -isystem "$deps/SDL3-3.4.10/include" -isystem "$deps/vsg/include" -isystem "$deps/vsg-build/include")
          failed=0
          for source in components/misc/hostmemory.cpp components/resource/multiobjectcache.cpp components/resource/resourcesystem.cpp components/resource/scenemanager.cpp components/resource/bulletshapemanager.cpp apps/openmw/mwworld/cellpreloader.cpp apps/openmw/mwworld/scene.cpp apps/openmw/engine.cpp; do
            log="$out/syntax-$(echo "$source" | tr '/' '-').log"
            if g++ "${flags[@]}" "$source" > "$log" 2>&1; then echo "PASS $source"; else cat "$log"; failed=1; fi
          done
          for source in apps/openmw/mwrender/v4scenerenderlifecycle.cpp apps/openmw/engine.cpp; do
            log="$out/syntax-vulkan-$(basename "$source").log"
            if g++ "${flags[@]}" -DOPENMW_ENABLE_V4_VULKAN_RUNTIME=1 "$source" > "$log" 2>&1; then echo "PASS Vulkan $source"; else cat "$log"; failed=1; fi
          done
          test "$failed" = 0
      - name: Verify integration preserved source and configuration contracts
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combined-validation"
          for script in tools/v4/cp4/test-host-memory-integration.py tools/v4/cp4/test-diagnostic-linkage.py tools/v4/cp4/test-diagnostic-header-boundary.py tools/v4/cp3e/application-route-contract.py tools/v4/cp4/streaming-contract.py tools/v4/cp4/population-environment-contract.py tools/v4/cp4/water-environment-contract.py tools/v4/cp4/video-ui-contract.py tools/v4/cp4/animated-object-contract.py tools/v4/cp4/fullbody-first-person-contract.py tools/v4/cp4/runtime-blocker-contract.py tools/v4/V4-CP0A-Verify-Materialized-Generated-Outputs.py; do
            python3 "$script" 2>&1 | tee -a "$out/contracts.log"
          done
          git diff --exit-code 3de01e9b4804bcec940a9aef3f71b96035c5b25f -- apps/openmw/mwlua/worker.cpp apps/openmw/mwlua/worker.hpp components/settings/ramcache.hpp components/settings/v36profile.hpp apps/openmw/mwrender/v4effectuv.hpp components/render/backend/vsg/immediateeffectcontract.hpp
          python3 - <<'PY'
          import pathlib, yaml
          for path in pathlib.Path('.github/workflows').glob('*.yml'): yaml.safe_load(path.read_text())
          print('Workflow YAML: PASS')
          PY
          git diff --cached --check
      - name: Publish only validated implementation paths on staging branch
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combined-validation"
          test "$(git diff --cached --name-only | wc -l)" -eq 38
          git diff --cached --name-only > "$out/changed-paths.txt"
          git diff --cached --raw --abbrev=40 > "$out/source-blobs.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'CP4F: combine pressure-aware cache owner reclamation native terrain routing and reliable test launcher'
          git push origin HEAD:v4.0-cp4f-memory-terrain-repair-20260922
          git rev-parse HEAD | tee "$out/source-sha.txt"
          git archive --format=tar HEAD | gzip -1 > "$out/validated-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp4f-combined-memory-terrain-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/combined-validation/*.log
            ${{ runner.temp }}/combined-validation/*.txt
            ${{ runner.temp }}/combined-validation/*.patch
            ${{ runner.temp }}/combined-validation/validated-source.tar.gz
            ${{ runner.temp }}/combined-validation/recorder/*.jsonl
          retention-days: 14
          if-no-files-found: error
