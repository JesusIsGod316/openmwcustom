# WARNING: Users should NOT edit this file. Users should add their personal preferences to the settings.cfg file overriding this file.
# For the location of the settings.cfg file, as well as more detailed settings documentation, refer to:
#
#   https://openmw.readthedocs.io/en/latest/reference/modding/settings/index.html
#

[Camera]

# Near clipping plane (>0.0, e.g. 0.01 to 18.0).
near clip = 1

# Cull objects that occupy less than 'small feature culling pixel size' on the screen.
small feature culling = true

small feature culling pixel size = 2.0

# Maximum visible distance. Caution: this setting
# can dramatically affect performance, see documentation for details.
viewing distance = 7168.0

# Camera field of view in degrees (e.g. 30.0 to 110.0).
# Does not affect the player's hands in the first person camera.
field of view = 60.0

# Field of view for first person meshes (i.e. the player's hands)
# Best to leave this at the default since vanilla assets are not complete enough to adapt to high FoV's. Too low FoV would clip the hands off screen.
first person field of view = 60.0

# V3.21 CP3: render the normal player body and equipment from the native first-person camera.
# The separate head and hair parts remain hidden. A small yaw-relative forward
# offset places the camera at the eyes/in front of the open top of the neck.
v3.21 full body first person = false
v3.21 full body first person shadow compatibility = false
v3.21 full body first person forward offset = 10.0

# Reverse the depth range, reduces z-fighting of distant objects and terrain
reverse z = true

# Software occlusion culling using a CPU depth buffer (Intel Masked Occlusion Culling).
# Terrain and building meshes are rasterized into a low-res depth buffer during cull traversal.
# Objects whose AABB is fully behind the depth buffer are skipped before draw.
occlusion culling = false

# Rasterize terrain heightmap into the occlusion depth buffer.
occlusion culling terrain = true

# Rasterize simplified building meshes into the occlusion depth buffer.
# Buildings are vertex-clustered into lightweight LODs at load time and cached.
# Works with both paged (ObjectPaging) and unpaged (cell) objects.
occlusion culling statics = true

# Resolution of the software occlusion depth buffer (pixels).
# Higher = more precise occlusion but slower rasterization.
occlusion buffer width = 512
occlusion buffer height = 256

# Terrain LOD level for the occlusion mesh (0=full detail, 6=very coarse).
# Controls vertex stride: LOD 0 = every vertex, LOD 2 = every 4th, LOD 3 = every 8th.
# Higher values reduce terrain rasterization cost at the expense of occlusion accuracy.
occlusion terrain lod = 3

# Radius in cells around the camera to include terrain as occluder.
occlusion terrain radius = 2

# Minimum bounding sphere radius (world units) for a static object to be used as an occluder.
# Objects with radius >= this are vertex-clustered into simplified meshes and rasterized.
# Lower = more occluders (better occlusion, more rasterization cost). 200 catches most buildings.
occlusion occluder min radius = 400

# Maximum bounding sphere radius (world units) for an unpaged occluder candidate.
# Objects larger than this are skipped as occluders in the cell path (camera is likely inside them).
# Does not affect paged objects, which use min radius only.
occlusion occluder max radius = 5000

# Shrink factor applied to occluder meshes toward their centroid.
# Prevents false occlusion from simplified geometry that slightly exceeds the original shape.
# 1.0 = exact size, <1.0 = smaller.
occlusion occluder shrink factor = 1

# Base grid resolution for vertex clustering of occluder meshes.
# Vertices are snapped to a 3D grid of this resolution per longest axis.
# Higher = more triangles (accurate shape), lower = fewer triangles (faster rasterization).
occlusion occluder mesh resolution = 7

# Maximum grid resolution for adaptive scaling of large occluders.
# Objects larger than min radius get proportionally higher resolution, capped at this value.
# Ensures massive structures (e.g. Vivec cantons) preserve openings like tunnels and archways.
occlusion occluder max mesh resolution = 24

# Scale factor for the AABB used to detect if the camera is inside an occluder.
# When inside, the object is not rasterized as an occluder (it would fill the entire buffer).
# 1.0 = exact AABB, >1.0 = larger exclusion zone, <1.0 = smaller.
occlusion occluder inside threshold = 1.0

# Maximum distance (world units) for rasterizing a building as an occluder.
# Beyond this distance, buildings are still tested for visibility but not rasterized.
# Distant buildings are small on screen and unlikely to occlude much.
occlusion occluder max distance = 6144

# Show the software occlusion depth buffer as an overlay in the bottom-left corner.
occlusion debug overlay = false

# Log periodic occlusion culling statistics (triangle counts, occluded objects, etc).
occlusion debug messages = false

# Enable software occlusion culling in interior cells. Default off.
occlusion culling interiors = false

# Maximum number of building occluder triangles to rasterize per frame (0 = unlimited).
# Prevents CPU choke in very dense scenes. Terrain is always rasterized regardless.
occlusion max triangles = 30000

# V3.4: allow large objects that were not admitted as occluders to be rejected by the completed full MSOC buffer.
# The launcher can pair this with a lower occluder radius / longer occluder range. Disabled by default.
v3.4 broaden occlusion = false

# V3.5 coarse MSOC. Culls whole paged-object and groundcover chunks with tight chunk bounds.
# Unlike V3.4 broadened MSOC, this does not lower the individual-occluder size threshold or raise its triangle budget.
v3.5 coarse chunk occlusion = false

[V3]

# V3.6 normal-play profile. This deliberately overrides stale V3.5 false values for the three proven optimizations.
# Set the profile false for legacy per-setting behavior, or use an individual disable switch for troubleshooting.
v3.6 performance profile = true
v3.6 disable ram overdrive = false
v3.6 disable lua fast path = false
v3.6 disable coarse chunk occlusion = false

# V3.19 promoted normal-play focus refresh cadence. 1 reproduces the V3.18/P0
# control behavior; 2 is the validated stable gaming default; 3 remains available
# for manual experimentation. GUI mode still refreshes focus every frame.
v3.19 focus cadence = 2

# V3.20 optional camera-dirty forcing. False preserves the exact promoted P0
# fixed cadence. When true, view/projection changes force an immediate refresh;
# v3.19 focus cadence remains the hard maximum staleness bound.
v3.20 adaptive focus cadence = false

# V3.21 CP1 completed-work admission governor. Default off preserves the V3.20
# foundation. Fixed mode does not throttle WorkQueue/preload producers.
v3.21 completion governor mode = 0
v3.21 compile objects per frame = 4
v3.21 merge sets per frame = 2
v3.21 max deferred frames = 4
v3.21 forced merge sets = 2
v3.21 compile minimum milliseconds = 1.0
v3.21 compile conservative ratio = 0.25
# MODE 127 adaptive completed-set admission. Target is deliberately above the
# current ~22 ms steady center so adaptation reacts to tail pressure instead of
# permanently starving useful work.
v3.21 adaptive target milliseconds = 24.0
v3.21 adaptive frame ema alpha = 0.20
v3.21 adaptive merge minimum = 1
v3.21 adaptive merge maximum = 4
v3.21 adaptive debt cap = 8
v3.21 adaptive debt repay per frame = 1

# V3.21 CP2 fairness/dephasing. Mode 0 preserves CP1/V3.20 behavior.
# Mode 1 stages only fully completed ICO sets; WorkQueue preparation is untouched.
v3.21 CP2 fairness mode = 0
v3.21 CP2 service sets per frame = 6
v3.21 CP2 class burst sets per frame = 3
v3.21 CP2 max deferred frames = 6
v3.21 CP2 forced sets = 2
v3.21 CP2 deficit cap = 12

# Diagnostics/experiments remain off unless explicitly selected.
v3.6 async gpu profiler = false
v3.6 far caster minimum pixels = 0.0

# V3.7 proven-profile extension. Two-pixel far-cascade projected-size pruning is
# enabled by the normal performance profile; this switch turns only that feature off.
v3.7 disable far caster pruning = false

# Semantics-preserving bulk OnActive dispatch experiment. Default off until A/B tested.
v3.7 active event fast path = false

# Preload a companion .kf for any preloaded NIF when one exists, not only the legacy x-prefixed path.
# This keeps immutable keyframe parsing on the existing preload worker instead of the activation path.
v3.7 companion keyframe preload = false

# Overdrive keeps resources for long periods, so sweeping every second mostly burns worker/cache-lock time.
# This experiment only changes the sweep cadence; expiry semantics and cache contents are otherwise unchanged.
v3.7 relaxed resource cache sweep = false
v3.7 resource cache sweep seconds = 5.0

# Snap only the far orthographic cascade to its actual texture texel grid.
# This is a visual-stability experiment, not whole-map reuse, and is off until A/B tested.
v3.7 stabilize far shadow cascade = false

# V3.8 traversal-smoothness/GPU-efficiency controls.
# world batching mode: 0=V3.7 heuristic, 1=conservative, 2=moderate, 3=aggressive.
# The merge multiplier is applied on top of OpenMW's existing object-paging merge factor.
# Repeated-template forcing starts at mode 2 and obeys the min-instance threshold.
v3.8 world batching mode = 0
v3.8 world batching merge multiplier = 1.5
v3.8 world batching min instances = 2

# GPU residency mode: 0=off, 1=conservative, 2=moderate, 3=aggressive.
# Reclamation only shortens the lifetime of stale cache-only rendered scene/paged
# objects while adapter pressure is elevated. It does not shorten NIF/image source
# caches and cannot evict live scene nodes.
v3.8 gpu residency mode = 0

# Additional far-cascade projected-size pruning layered on the proven V3.7 2px baseline.
# 0=proven 2px, 1=2.5px conservative, 2=3.5px moderate, 3=5px aggressive.
# Only the farthest shadow cascade is affected.
v3.8 far shadow mode = 0

# Incremental OpenGL compile pacing for newly paged/preloaded render objects.
# 0=OpenMW/default, 1=conservative burst cap, 2=balanced preparation, 3=aggressive preparation.
v3.8 compile pacing mode = 0

# V3.9 startup-frontload / traversal-smoothness controls.
# frontload: 0=off, 1=center+cardinals, 2=3x3 viewpoints, 3=5x5 viewpoints.
# The extra work is intentionally allowed to extend the initial loading screen so
# strong ObjectPaging batches are already built before ordinary movement.
v3.9 frontload mode = 0

# Post-merge optimizer policy. Strong V3.8 merge admission is unchanged.
# 0=exact V3.8, 1=merge only, 2=merge+shared-state, 3=merge+post-transform+shared-state.
v3.9 batch optimizer mode = 0

# Earlier cache-only render-graph reclamation while adapter pressure is Soft.
# 0=V3.8 behavior, 1=gentle, 2=balanced, 3=aggressive.
v3.9 proactive residency mode = 0

# V3.10 startup-frontload controls. Both default off and therefore preserve V3.9.
# `fresh initial object paging` discards only the ObjectPaging CHUNK cache after any
# older terrain prediction worker has been stopped and before the one-time initial
# multi-view preload is dispatched. It does not clear source scene/image/keyframe caches.
v3.10 fresh initial object paging = false

# When true, the fresh one-time initial frontload receives VERTEX_POSTTRANSFORM
# vertex-cache ordering plus shared-state compaction. Later predictive/background
# preload and synchronous gameplay-demand misses do not receive this V3.10 pass.
# VERTEX_PRETRANSFORM is never enabled by this switch.
v3.10 preload post-transform = false

# V3.11 exact active-grid preparation. 0=off/inherited behavior,
# 1=strong prepared active-grid chunks + shared-state compaction,
# 2=same exact population + VERTEX_POSTTRANSFORM. Demand misses remain Mode1.
v3.11 active grid prepare mode = 0

# V3.12 traversal/Lua refinements. All default off so Mode66 is an exact control.
# Predictor mode 1 puts an imminent adjacent grid (estimated by time-to-boundary)
# first. Mode 2 may add the ordinary prediction as a second, lower-priority horizon.
v3.12 predictor mode = 0
v3.12 predictor lead seconds = 3.0
# Precompile configured Lua source to the existing bytecode cache during loading.
# This never runs a script body or onInit/onLoad.
v3.12 lua precompile = false
# Spatial prepared-active batching: 0=exact Mode66 single merge group,
# 1=split mergeable prepared active-grid geometry into 2x2 chunk-local clusters.
v3.12 spatial batch mode = 0

# V3.13 deterministic ObjectPaging cache quality repair.
# 0=exact inherited first-writer behavior; 1=repair weak/lower-quality cached active
# chunks on strong compile=true preload; 2=mode1 + require matching V3.12 spatial
# prepared signature. Demand fallback remains nonblocking in every mode.
v3.13 chunk quality mode = 0

# V3.14 first-use and render preparation layer.
# Lua dependency precompile: 0=off, 1=literal direct requires, 2=recursive literal requires.
v3.14 lua dependency precompile mode = 0
# Reuse one immutable static-package prototype per ScriptsContainer sandbox family.
v3.14 lua package prototype reuse = false
# Groundcover ICO compile: 0=inherited, 1=only compile=true preload chunks, 2=all newly-created chunks.
v3.14 groundcover compile mode = 0
# Feed active PostFX pass state/programs through the existing IncrementalCompileOperation.
v3.14 postfx compile warmup = false

# V3.16 general-play hitch controls.
# Build the immutable ESM sound-id/resource metadata maps while the startup
# loading screen is still active instead of on the first gameplay SFX lookup.
v3.16 sfx metadata frontload = false

# V3.15 renderer/submission + traversal-tail controls.
# Canonicalize structurally equal immutable StateSets before MERGE_GEOMETRY so
# OpenMW's existing merger can combine more render-equivalent static geometry.
v3.15 premerge state canonicalization = false
# Temporary hierarchical premerge packets for strong prepared active-grid chunks.
# 0=off, 1=4 spatial packets, 2=16 spatial packets. Packets are recombined into
# one final strong topology before the existing Mode79-quality final optimizer.
v3.15 packetized premerge mode = 0
# Adapt ICO's speculative GL compile budget from actual frame duration.
# 0=off/inherited V3.8 pacing, 1=balanced, 2=aggressive tail protection.
v3.15 adaptive compile governor = 0

# V3.16: move periodic ResourceSystem cache maintenance off the shared preload
# work queue onto one dedicated idle-priority worker. This keeps the same cache
# expiry semantics while reducing contention with gameplay-critical preloading.
v3.16 idle resource sweep = false

[Cells]

# V3 RAM/cache policy preset.
# normal = upstream OpenMW cache behavior.
# aggressive = longer-lived caches for systems with spare RAM.
# extreme = 32 GB-class preset with 10-minute retention and a large preload cache.
# overdrive = experimental 32 GB+ maximum-residency preset. Retains general resources, terrain/object/grass chunks,
#             collision data and raw parsed NIFs much longer so revisits can reuse already-built data.
# Presets act as minimums: manually configured values that are already larger are preserved.
ram cache mode = normal

# Only affects ram cache mode = overdrive.
# balanced keeps speculative preload pressure moderate while retaining data for a long time.
# aggressive and maximum progressively increase preload capacity/prediction for experimentation.
ram cache overdrive preload = balanced

# V3 experimental walking-stutter scheduler. OFF preserves normal OpenMW behavior.
# adaptive paces predictive background cell-preload scheduling after an already-slow frame.
# Required cell, terrain, object-page and groundcover rendering is never skipped.
v3 streaming scheduler = off
v3 streaming target frametime = 25

# V3 experimental prepared static-instance pool. The preload worker clones safe static scene instances ahead of time,
# and cell activation consumes those already-prepared clones instead of cloning the same templates on the main thread.
# OFF preserves normal OpenMW behavior. Start around 8192 on a 32 GB system; the pool is strictly bounded.
v3 prepared instance cache = false
v3 prepared instance cache max = 8192

# V3.2 transition/memory experiments. All are OFF by default.
v3.2 exterior hibernation = false
v3.2 renderer insertion profiling = false
v3.2 gpu memory telemetry = false
v3.2 gpu memory management = false
v3.2 gpu soft budget mb = 6800
v3.2 gpu hard budget mb = 7400
v3.2 streaming max defers = 2

# V3.3 frame-pacing experiment. 0 preserves the upstream unlimited speculative scheduling behavior.
# Positive values cap only NEW predictive outer-ring cell preload jobs per frame; required cell activation is unchanged.
v3.3 speculative preload budget = 0

# Preload cells in a background thread. All settings starting with 'preload' have no effect unless this is enabled.
preload enabled = true

# The number of threads to be used for preloading operations.
preload num threads = 1

# Preload adjacent cells when moving close to an exterior cell border.
preload exterior grid = true

# Preload possible fast travel destinations.
preload fast travel = false

# Preload the locations that doors lead to.
preload doors = true

# Preloading distance threshold
preload distance = 1000

# Controls whether or not the nodes/collision shapes are pre-"instanced" (i.e. cloned) when a cell is preloaded.
# Enabling this option slightly reduces the time it takes to transition into a preloaded cell, but also results in higher memory usage
# proportional to the number of cells that are preloaded.
preload instances = true

# The minimum amount of cells in the preload cache before unused cells start to get thrown out (see "preload cell expiry delay").
# This value should be lower or equal to 'preload cell cache max'.
preload cell cache min = 12

# The maximum amount of cells in the preload cache. A too high value could cause you to run out of memory.
# You may need to reduce this setting when running lots of mods or high-res texture replacers.
preload cell cache max = 20

# How long to keep preloaded cells in cache after they're no longer referenced/required (in seconds)
preload cell expiry delay = 5

# The predicted position of the player N seconds in the future will be used for preloading cells and distant terrain
prediction time = 1

# How long to keep models/textures/collision shapes in cache after they're no longer referenced/required (in seconds)
cache expiry delay = 5

# Affects the time to be set aside each frame for graphics preloading operations
target framerate = 60

# The count of pointers, that will be saved for a faster search by object ID.
pointers cache size = 40

[Terrain]

# If true, use paging and LOD algorithms to display the entire terrain. If false, only display terrain of the loaded cells
distant terrain = false

# Controls how the Quad Tree is split. This affects Vertex LOD, Texture LOD and load times. Values > 1 increase detail, values < 1 reduce detail.
lod factor = 1.0

# Controls only the Vertex LOD. Change in increments of 1, each change doubles (or halves) the number of vertices. Values > 0 increase detail, values < 0 reduce detail.
vertex lod mod = 0

# Controls when the distant terrain will flip to composited textures instead of high-detail textures, should be >= -3.
# Higher value is more detailed textures.
composite map level = 0

# Controls the resolution of composite maps.
composite map resolution = 512

# Controls the maximum size of composite geometry, should be >= 1.0. With low values there will be many small chunks, with high values - lesser count of bigger chunks.
max composite geometry size = 4.0

# Draw lines arround chunks.
debug chunks = false

# Use object paging for non active cells
object paging = true

# Use object paging for active cells grid
object paging active grid = true

# Affects the likelyhood of more complex objects to get paged. Higher values improve visual fidelity at the cost of performance and RAM.
object paging merge factor = 250

# Cull objects smaller than this size divided by distance
object paging min size = 0.01

# Adjusts 'min size' based on merging decision. Allows inexpensive objects to be rendered from a greater distance.
object paging min size merge factor = 0.3

# Controls how inexpensive an object needs to be to utilize 'min size merge factor'.
object paging min size cost multiplier = 25

# Don't draw water if it's evaluated to be below all visible terrain
water culling = true

[Fog]

# If true, use extended fog parameters for distant terrain not controlled by
# viewing distance. If false, use the standard fog calculations.
use distant fog = false

distant land fog start = 16384

distant land fog end = 40960

distant underwater fog start = -4096

distant underwater fog end = 2457.6

distant interior fog start = 0

distant interior fog end = 16384

# Determine fog intensity based on the distance from the eye point.
# This makes fogging independent from the viewing angle.
radial fog = false

# Whether to use exponential formula for fog.
exponential fog = false

# Whether to hide the clipping plane by blending with sky.
sky blending = false

# Fraction of the maximum distance at which blending with the sky starts.
sky blending start = 0.8

# The sky RTT texture size, used only for sky blending. Smaller values
# reduce quality of the sky blending, but can have slightly better performance.
sky rtt resolution = 512 256

[Map]

# Size of each exterior cell in pixels in the world map. (e.g. 12 to 24).
# Warning: affects explored areas in save files, see documentation.
global map cell size = 18

# Enables Fog of War rendering on the HUD map. Default is Off since with default settings
# the map is so small that the fog would not obscure anything, just darken the edges slightly.
local map hud fog of war = false

# Resolution of local map in GUI window in pixels.  See documentation
# for details which may affect cell load performance. (e.g. 128 to 1024).
local map resolution = 256

# Size of local map in GUI window in pixels.  (e.g. 256 to 1024).
local map widget size = 512

# If true, map in world mode, otherwise in local mode
global = false

# If true, allow zoom on local and global maps
allow zooming = false

# The local view distance in number of cells (up to the view distance)
max local viewing distance = 10

[GUI]

# Scales GUI window and widget size. (<1.0 is smaller, >1.0 is larger).
scaling factor = 1.0

# Size of in-game fonts
font size = 16

# Transparency of GUI windows (0.0 to 1.0, transparent to opaque).
menu transparency = 0.84

# Time until tool tip appears when hovering over an object (0.0 is
# instantly, 1.0 is the maximum delay of about 1.5 seconds).
tooltip delay = 0.0

# Stretch menus, load screens, etc. to the window aspect ratio.
stretch menu background = false

# Make menus easier to navigate with a controller.
controller menus = false

# Trigger axis value required to count as pressed for controller menu actions. Value from 1-32767.
controller trigger press = 30720

# Trigger axis value below which the trigger is considered released again. Value from 0-32766.
# This value must be less than the value of trigger press. If not, it will be clamped to trigger press - 1.
controller trigger release = 26624

# When true, you do not need to press R3 to show tooltips.
controller tooltips = false

# Subtitles for NPC spoken dialog and some sound effects.
subtitles = false

# Red flash visually showing player damage.
hit fader = true

# Werewolf overlay border around screen or window.
werewolf overlay = true

# Color for tool tips and crosshair when owned by an NPC (R G B A).
color background owned = 0.15 0.0 0.0 1.0
color crosshair owned = 1.0 0.15 0.15 1.0

# Controls whether Arrow keys, Movement keys, Tab/Shift-Tab and Spacebar/Enter/Activate may be used to navigate GUI buttons.
keyboard navigation = true

# Apply the defined color to dialogue topic.
color topic enable = false

# The color of dialogue topic keywords that gives unique actor responses
color topic specific = 0.45 0.5 0.8 1
color topic specific over = 0.6 0.6 0.85 1
color topic specific pressed = 0.3 0.35 0.75 1

# The color of dialogue topic keywords that gives already read responses
color topic exhausted = 0.3 0.3 0.3 1
color topic exhausted over = 0.55 0.55 0.55 1
color topic exhausted pressed = 0.45 0.45 0.45 1

[HUD]

# Displays the crosshair or reticle when not in GUI mode.
crosshair = true

# Displays cursor circle when mouse emulation is active.
mouse emulation cursor = true

[Game]

# Color crosshair and tool tip when object is owned by an NPC. (O is
# no color, 1 is tool tip only, 2 is crosshair only, and 3 is both).
show owned = 0

# Show damage bonus of arrow and bolts.
show projectile damage = false

# Show additional weapon info: reach and attack speed
show melee info = false

# Show success probability in self-enchant dialog
show enchant chance = false

# Always use the best mode of attack: e.g. chop, slash or thrust.
best attack = false

# Difficulty.  Expressed as damage dealt and received. (e.g. -100 to 100).
difficulty = 0

# The maximum range of actor AI, animations and physics updates.
actors processing range = 7168

# Make reflected Absorb spells have no practical effect, like in Morrowind.
classic reflected absorb spells behavior = true

# Make Calm spells stop combat on every frame
classic calm spells behavior = true

# Show duration of magic effect and lights in the spells window.
show effect duration = false

# Prevent merchants from equipping items that are sold to them.
prevent merchant equipping = false

# Make enchanted weaponry without Magical flag bypass normal weapons resistance
enchanted weapons are magical = true

# Make player followers and escorters start combat with enemies who have started combat with them
# or the player. Otherwise they wait for the enemies or the player to do an attack first.
followers attack on sight = false

# Can loot non-fighting actors during death animation
can loot during death animation = true

# Make the value of filled soul gems dependent only on soul magnitude (with formula from the Morrowind Code Patch)
rebalance soul gem values = false

# Allow to load per-group KF-files from Animations folder
use additional anim sources = false

# Use smooth transitions between animations making them a lot less jarring. Also allows to load modded animation blending
# configs (.yaml/.json config files).
smooth animation transitions = false

# Make the disposition change of merchants caused by barter dealings permanent
barter disposition change is permanent = false

# Uses the MCP formula (damage * (strength / 40)) to factor Strength into hand-to-hand combat.
# (0 means it does not factor it in, 1 means it factors into werewolves damage calculation and
# 2 means werewolves are ignored)
strength influences hand to hand = 0

# Render holstered weapons (with quivers and scabbards), requires modded assets
weapon sheathing = false

# Render holstered shield when it is not in actor's hands, requires modded assets
shield sheathing = false

# Allow non-standard ammunition solely to bypass normal weapon resistance or weakness
only appropriate ammunition bypasses resistance = false

# Use casting animations for magic items, just as for spells
use magic item animations = false

# Don't use race weight in NPC movement speed calculations
normalise race speed = false

# Adjusts the number of projectiles you can enchant at once:
# count = (soul gem charge * projectiles enchant multiplier) / enchantment strength
# A value of 0 means that you can only enchant one projectile.
projectiles enchant multiplier = 0

# Make Damage Fatigue magic effect uncapped like Drain Fatigue effect.
# This means that unlike Morrowind you will be able to knock down actors using this effect.
uncapped damage fatigue = false

# Turn lower body to movement direction. 'true' makes diagonal movement more realistic.
turn to movement direction = false

# Makes all movements of NPCs and player more smooth.
smooth movement = false

# Max delay of turning (in seconds) if player drastically changes direction on the run.
smooth movement player turning delay = 0.333

# All actors avoid collisions with other actors.
NPCs avoid collisions = false

# Give way to moving actors when idle. Requires 'NPCs avoid collisions' to be enabled.
NPCs give way = true

# Makes player swim a bit upward from the line of sight.
swim upward correction = false

# Strength of the 'swim upward correction' effect (if enabled).
swim upward coef = 0.2

# Make the training skills proposed by a trainer based on its base attribute instead of its modified ones
trainers training skills based on base skill = false

# Make stealing items from NPCs that were knocked down possible during combat.
always allow stealing from knocked out actors = false

# Enables visually harvesting plants for models that support it.
graphic herbalism = true

# Give actors an ability to swim over water surface when they follow other actor independently from their ability to swim
# (true, false)
allow actors to follow over water surface = true

# Default size of actor for navmesh generation
default actor pathfind half extents = 29.27999496459961 28.479997634887695 66.5

# Enables use of day/night switch nodes
day night switches = true

# Collision is used for both physics simulation and navigation mesh generation for pathfinding:
# 0 = Axis-aligned bounding box
# 1 = Rotating box
# 2 = Cylinder
actor collision shape type = 0

# When false the player character will base movement on animations. This will sway the camera
# while moving in third person like in vanilla, and reproduce movement bugs caused by glitchy
# vanilla animations.
player movement ignores animation = false

# Makes focused object selection account for terrain.
terrain obstructs focus = false

[General]

# Anisotropy reduces distortion in textures at low angles (e.g. 0 to 16).
anisotropy = 4

# File format for screenshots.  (jpg, png, tga, and possibly more).
screenshot format = png

# Texture magnification filter type.  (nearest or linear).
texture mag filter = linear

# Texture minification filter type.  (nearest or linear).
texture min filter = linear

# Texture mipmap type.  (none, nearest, or linear).
texture mipmap = nearest

# Show message box when screenshot is saved to a file.
notify on saved screenshot = false

# List of the preferred languages separated by comma.
# For example "de,en" means German as the first prority and English as a fallback.
preferred locales = en

# If true then l10n/*/gmst.yaml has priority over other l10n files.
gmst overrides l10n = true

# Buffer size for the in-game log viewer (press F10 to toggle). Zero disables the log viewer.
log buffer size = 65536

# Number of console history objects to retrieve from previous session.
console history buffer size = 4096

[Shaders]

# Force the use of per pixel lighting. By default, only bump and normal mapped objects use per-pixel lighting.
# Enabling per-pixel lighting can result in visual differences to the original MW engine as
# certain lights in Morrowind rely on vertex lighting to look as intended.
# Note that groundcover shaders and particle effects ignore this setting.
force per pixel lighting = false

# Allow particle systems to receive lighting from point lights.
# This is the default behavior in Morrowind.exe.
# Disabling this can contribute to a significant increase in performance in particle-dense scenes.
particle point lighting = true

# Restrict the amount of lighting that an object can receive to a maximum of (1,1,1).
# Setting this option to 'true' results in fixed-function compatible lighting, but the lighting
# may appear 'dull' and there might be color shifts.
# Setting this option to 'false' results in more realistic lighting.
clamp lighting = true

# If this option is enabled, normal maps are automatically recognized and used if they are named appropriately
# (see 'normal map pattern', e.g. for a base texture foo.dds, the normal map texture would have to be named foo_n.dds).
# If this option is disabled, normal maps are only used if they are explicitly listed within the mesh file (.nif or .osg file).
# Affects objects.
auto use object normal maps = false

# If this option is enabled, specular maps are automatically recognized and used if they are named appropriately
# (see 'specular map pattern', e.g. for a base texture foo.dds, the specular map texture would have to be named foo_spec.dds).
# If this option is disabled, normal maps are only used if they are explicitly listed within the mesh file (.osg file, not supported in .nif files).
# Affects objects.
auto use object specular maps = false

# See 'auto use object normal maps'. Affects terrain.
auto use terrain normal maps = false

# If a file with pattern 'terrain specular map pattern' exists, use that file as a 'diffuse specular' map. The texture
# must contain the layer color in the RGB channel (as usual), and a specular multiplier in the alpha channel.
auto use terrain specular maps = false

# The filename pattern to probe for when detecting normal maps (see 'auto use object normal maps', 'auto use terrain normal maps')
normal map pattern = _n

# Alternative filename pattern to probe for when detecting normal maps. Files with this pattern are expected to include 'height' in the alpha channel.
# This height is used for parallax effects. Works for both terrain and objects.
normal height map pattern = _nh

# The filename pattern to probe for when detecting object specular maps (see 'auto use object specular maps')
specular map pattern = _spec

# The filename pattern to probe for when detecting terrain specular maps (see 'auto use terrain specular maps')
terrain specular map pattern = _diffusespec

# Apply lighting to reflections on the environment-mapped objects like in Morrowind Code Patch.
apply lighting to environment maps = false

# Divides the screen into regions to assign lights, removing per-object light limits.
# Classic falloff and max light options do not apply in this mode.
# Enables point light specular highlights on the water plane when the water shader is enabled.
clustered lighting = false

# Use the traditional light attenuation formula.
# This disables OpenMW's adjustment to the formula that ensures point lights can properly fade out.
# This setting is only applicable when clustered lighting is disabled
classic falloff = false

# Matches exterior sunlight to the apparent sun orbit
match sunlight to sun = false

# Increases the radius of all point lights. Has no effect if 'classic falloff' is used.
light radius multiplier = 1.75

# The distance from the camera at which lights fade away completely.
# Set to 0 to disable fading.
maximum light distance = 8192

# Fraction of the maximum distance at which lights begin to gradually fade away.
light fade start = 0.85

# Set maximum number of lights per object.
max lights = 16

# Sets minimum ambient brightness of interior cells. Levels below this threshold will have their
# ambient values adjusted to balance the darker interiors.
# This setting will have no effect if 'classic falloff' is true.
minimum interior brightness = 0.08

# Convert the alpha test (cutout/punchthrough alpha) to alpha-to-coverage.
# This allows MSAA to work with alpha-tested meshes, producing better-looking edges without pixelation.
# When MSAA is off, this setting will have no visible effect, but might have a performance cost.
antialias alpha test = false

# Attempt to simulate coverage-preserving mipmaps in textures created without them which are used for alpha testing anyway.
# This will somewhat mitigate these objects appearing to shrink as they get further from the camera, but isn't perfect.
# Better results can be achieved by generating more appropriate mipmaps in the first place, but if this workaround is used with such textures, affected objects will appear to grow as they get further from the camera.
# It is recommended that mod authors specify how this setting should be set, and mod users follow their advice.
adjust coverage for alpha test = true

# Soften intersection of blended particle systems with opaque geometry
soft particles = false

# Rain and snow particle occlusion
weather particle occlusion = false

weather particle occlusion small feature culling pixel size = 4.0

