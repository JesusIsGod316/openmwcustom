# Isolated Vulkan baseline, not a claim of maximum performance.
# Resolved against the selected executable's defaults.bin by vulkan-profile.py.
# Keep original mod content and selected visual/gameplay settings separately.
[Video]
renderer backend = vulkan
renderer fallback = false
resolution x = 1920
resolution y = 1080
window mode = 2
vsync mode = 0
framerate limit = 0
antialiasing = 0
render scale = 1
upscaler = bilinear

[Post Processing]
enabled = false
chain =

[V3]
# Do not silently enable overdrive, coarse OSG occlusion and shadow pruning.
v3.6 performance profile = false
v3.6 async gpu profiler = false
v3.6 far caster minimum pixels = 0
v3.7 stabilize far shadow cascade = false
v3.8 world batching mode = 0
v3.8 gpu residency mode = 0
v3.8 far shadow mode = 0
v3.8 compile pacing mode = 0
v3.9 frontload mode = 0
v3.9 batch optimizer mode = 0
v3.9 proactive residency mode = 0
v3.10 fresh initial object paging = false
v3.10 preload post-transform = false
v3.11 active grid prepare mode = 0
v3.12 spatial batch mode = 0
v3.13 chunk quality mode = 0
v3.14 groundcover compile mode = 0
v3.14 postfx compile warmup = false
v3.15 premerge state canonicalization = false
v3.15 packetized premerge mode = 0
v3.15 adaptive compile governor = 0
v3.21 completion governor mode = 0
v3.21 CP2 fairness mode = 0
# Shared engine optimizations: independent of OpenGL command submission.
v3.19 focus cadence = 2
v3.12 lua precompile = true
v3.14 lua dependency precompile mode = 2
v3.14 lua package prototype reuse = true
v3.16 sfx metadata frontload = true

[Cells]
# The GL-P1 switches are explicitly guarded out on Vulkan in engine.cpp.
opimizedmw host pressure = false
opimizedmw speculative budget = false
opimizedmw paging optimizer = false
opimizedmw paging readiness split = false
ram cache mode = normal
preload enabled = true
preload num threads = 2
preload cell cache min = 12
preload cell cache max = 20
preload cell expiry delay = 5
cache expiry delay = 5
v3 prepared instance cache = false
v3.2 exterior hibernation = false
v3.2 gpu memory telemetry = false
v3.2 gpu memory management = false
v3.2 renderer insertion profiling = false
v3 streaming scheduler = off

[Camera]
# Legacy OSG MSOC is not the Vulkan visibility implementation.
occlusion culling = false
v3.4 broaden occlusion = false
v3.5 coarse chunk occlusion = false

[Lua]
lua num threads = 1
lua profiler = false
v3.3 idle timer fast path = true
