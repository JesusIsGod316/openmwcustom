# OptimizedMW editable optimization settings. The Custom settings launcher
# copies this once to Configuration/Optimizations.cfg; edit that copy.
# Old names remain compatible. This file uses descriptive canonical keys.
# Changes apply to the test run; the original gameplay settings are restored.
# Compare custom captures only when this file's recorded hash is identical.
#
# The historical performance profile is explicitly disabled. Individual
# controls below retain the current Lua, occlusion, paging, resource and
# shadow foundation with the lower Headroom RAM residence settings.
# RAM times/counts are not a process byte ceiling. Live resources remain
# protected. No 4 GiB cold-cache guarantee or compression is implemented.
# Experimental cache budget covers retained output plus outstanding scratch;
# scratch also has its own smaller limit and the common transient allowance.
#
# false/true controls are switches. Numeric modes preserve the existing
# meanings documented in settings-default.cfg and the source; zero normally
# disables an experiment. Engine sanitizers still apply bounds.
# ram cache mode = normal uses the entered residence/count values directly;
# aggressive/extreme/overdrive opt into documented preset minimums.
# Asset, architecture and diagnostic experiments remain separately selected
# in the launcher; this file does not silently enable DLSS or GPU draw probes.

